<script>(()=>{const E=GoldDailyReturnTime,$=s=>document.querySelector(s),spine={id:'return_second_serve_steal_time',prototypeId:'gold_return_time_v1',slug:'return-time',title:'The Second Serve You Let Escape',prototypeDecisionLenses:['opportunity','clock','boundary'],proInsight:{player:'Andre Agassi'}};const lesson=E.lessons({byId:{return_second_serve_steal_time:spine}})[0];let scene=2,selected=null,t=0,raf=0,ended=false,start=0;function draw(){const step=lesson.steps[scene],tl=E.timelineFor(step,selected!==null),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;$('#visual').innerHTML=E.render(step,selected,t,reduced);$('#clock').textContent=t.toFixed(2)+' s display · authored physical clocks shown in court';const done=selected!==null&&t>=(selected===step.correct?tl.inkAt:tl.correctionInkAt);$('.payoff').textContent=done?step.payoff:'';$('.why').textContent=done?step.why:'';}function play(){cancelAnimationFrame(raf);t=0;ended=false;const step=lesson.steps[scene],tl=E.timelineFor(step,selected!==null),total=selected===step.correct?tl.inkAt+.3:tl.total;if(matchMedia('(prefers-reduced-motion: reduce)').matches){t=total;ended=true;draw();return;}start=performance.now();function tick(now){t=Math.min(total,(now-start)/1000);draw();if(t>=total)ended=true;else raf=requestAnimationFrame(tick);}draw();raf=requestAnimationFrame(tick);}function setScene(i){scene=i;selected=null;const step=lesson.steps[i];$('h1').textContent=lesson.title+' · '+(i+1)+' of 3';$('#situation').textContent=step.situation;$('h2').textContent=step.question;$('.choices').innerHTML=step.options.map((o,j)=>'<button data-choice="'+j+'">'+o.id+' · '+o.text+'</button>').join('');document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{selected=+b.dataset.choice;play();});play();}document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>setScene(+b.dataset.scene));$('#replay').onclick=play;window.returnTimeProof={setScene,get state(){return {scene,selected,t,ended};}};setScene(2);})();</script></html>
