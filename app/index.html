/* ---- cinematic Home (5 Oct) ---- */
.cine-bg{display:none}
body.cine-on .cine-bg{display:block;position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;z-index:0}
body.cine-on .gs-real-home-court{display:none!important}
body.cine-on .gs-hero-slogan{visibility:hidden}
body.cine-on .gs-hero-header{overflow:visible;min-height:88px}
body.cine-on #homeScreen{background:transparent}
body.cine-on .gs-main{position:relative;z-index:2}
body.cine-on #main{display:flex;flex-direction:column;min-height:calc(100dvh - var(--gs-nav-h) - env(safe-area-inset-top) - 92px);max-width:706px;margin:0 auto;padding:0 18px 14px}   /* one card: it sits just above the bottom nav (5 Oct) */
.cine-hero{position:relative;text-align:center;padding:4px 0 0}
.cine-promise{font-family:"Bebas Neue",Impact,sans-serif;font-size:clamp(38px,11vw,64px);line-height:.95;letter-spacing:.02em;color:#f4f1e8;text-shadow:0 2px 24px rgba(0,0,0,.6);opacity:0;animation:cineIn .9s .15s cubic-bezier(.2,.7,.2,1) forwards}
.cine-promise span{color:var(--gold);display:inline-block}
.cine-tag{margin-top:8px;font-size:13px;letter-spacing:.04em;color:rgba(244,241,232,.8);text-shadow:0 1px 10px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.8);opacity:0;animation:cineIn .9s .45s cubic-bezier(.2,.7,.2,1) forwards}
.cine-sound{position:absolute;right:0;top:0;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(4,12,7,.45);color:rgba(244,241,232,.85);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cine-sound[aria-pressed=false]{color:rgba(244,241,232,.45)}
.cine-card{margin-top:auto;position:relative;padding:16px 16px 14px;border-radius:20px;background:linear-gradient(180deg,rgba(6,16,9,.55),rgba(6,16,9,.86));border:1px solid rgba(200,168,75,.28);box-shadow:0 20px 50px rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;transform:translateY(14px);animation:cineUp .8s .7s cubic-bezier(.2,.7,.2,1) forwards}
.cine-label{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cine-title{margin:6px 0 4px;font-size:clamp(20px,5.6vw,30px);line-height:1.12;color:#f4f1e8;letter-spacing:-.01em}
.cine-title span{color:rgba(244,241,232,.6);font-weight:500}
.cine-sit{margin:0 0 12px;font-size:13.5px;line-height:1.45;color:rgba(244,241,232,.78)}
.cine-next{margin:2px 0 4px;font-size:14px;color:rgba(244,241,232,.75)}.cine-next b{color:var(--gold);font-variant-numeric:tabular-nums}
.cine-card .note{font-size:13.5px;color:rgba(244,241,232,.7);margin:4px 0 14px}
a.btn.cine-cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border-radius:16px;background:linear-gradient(180deg,#d9bb5c,#c8a84b);color:#14110a;font-weight:800;font-size:16px;letter-spacing:.01em;text-decoration:none;box-shadow:0 8px 24px rgba(200,168,75,.35),inset 0 1px 0 rgba(255,255,255,.35);position:relative;overflow:hidden}
a.btn.cine-cta span{transition:transform .25s}a.btn.cine-cta:hover span{transform:translateX(4px)}
a.btn.cine-cta::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);animation:cineSheen 3.6s 1.8s ease-in-out infinite}
.cine-row{display:grid;grid-template-columns:1fr auto;gap:8px}
/* compact done-today card (5 Oct, Eoin: "far smaller") */
.cine-card.is-done{padding:12px 14px;border-radius:16px}
.is-done .cd-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.is-done .cd-next{font-size:12px;color:rgba(244,241,232,.7);white-space:nowrap}.is-done .cd-next b{color:var(--gold);font-variant-numeric:tabular-nums}
.is-done .cine-title{font-size:18px;margin:6px 0 2px}
.is-done .note{font-size:13px;line-height:1.4;margin:0 0 10px}
.is-done a.btn.cine-cta,.is-done a.btn.cine-ghost{min-height:44px;font-size:14px;border-radius:12px}
a.btn.cine-ghost{display:flex;align-items:center;justify-content:center;min-height:56px;padding:0 18px;border-radius:16px;border:1px solid rgba(255,255,255,.2);color:#f4f1e8;text-decoration:none;font-weight:700}
.cine-sub{margin-top:10px;text-align:center;font-size:12.5px}.cine-sub a{color:rgba(244,241,232,.62);text-decoration:underline;text-underline-offset:3px}
body.cine-on .supplement{background:rgba(6,17,9,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
body.cine-on #main>.supplement{margin-left:0;margin-right:0}
body.cine-on .foot{position:relative;z-index:2;opacity:.6}
@keyframes cineIn{from{opacity:0;transform:translateY(10px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes cineUp{to{opacity:1;transform:none}}
@keyframes cineSheen{0%{transform:translateX(-120%)}35%,100%{transform:translateX(120%)}}
@media(min-width:900px){body.cine-on #main{min-height:calc(100vh - 160px)}.cine-card{max-width:560px;margin-left:auto;margin-right:auto;width:100%}.cine-promise{font-size:76px}}
@media(prefers-reduced-motion:reduce){.cine-promise,.cine-tag,.cine-card{opacity:1;transform:none;animation:none}}

<script>
(function(){
const A=GSApp,S=A.S,$=id=>document.getElementById(id),q=new URLSearchParams(location.search),ALL=q.has("all"),REVIEW=q.has("review");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const href=l=>`play.html?l=${l.slug}`;
const dots3=d=>d?`<span class="done3" role="img" aria-label="Best score: ${d.best} of 3 correct">${[0,1,2].map(i=>`<i class="${i<d.best?"ok":""}"></i>`).join("")}</span>`:"";
const legacyEntry=["goldDaily","challenge","p","play","ch","legacy"].some(k=>q.has(k));
const legacyNotice=()=>legacyEntry?`<section class="supplement" aria-label="Previous app link"><div class="k">GameSharp has changed</div><p>This link belongs to the previous app. Its original activity isn't available in this version.</p><a class="gs-lesson-picker" href="./?all=1">Browse current lessons →</a></section>`:"";
/* Auto-start (5 Oct): a bare visit goes straight into today's challenge, like a show that starts playing.
   Rules: never when today's challenge is already done; never from inside the app (every in-app Home link carries ?home=1,
   and the lesson's back/close return to ?home=1, so Home never bounces you back); not when a legacy streak note must show. */
const plain=[...q.keys()].every(k=>/^utm_/.test(k)||k==="fbclid"||k==="gclid");
if(plain&&!legacyEntry){const L0=A.todays(),d0=L0&&S.done[L0.slug],carry0=S.migrated&&!Object.keys(S.done).length;
  if(L0&&A.isDaily(L0.slug)&&!(d0&&d0.first===A.today())&&!carry0){let intro=!Object.keys(S.done).length;try{if(localStorage.getItem("gs_intro_seen"))intro=false;}catch(e){}
    history.replaceState(null,"","./?home=1");location.href=`play.html?l=${L0.slug}&auto=1${intro?"&intro=1":""}`;return;}}
A.opened("home");
function streak(){const n=A.streakNow();$("streak").textContent=n?`${n} day${n>1?"s":""}`:"";}
let levelOpen=false;
function first(){if(!levelOpen&&(S.level||!Object.keys(S.done).length))return "";return `<section class="first supplement" id="player-level"><b>What's your game?</b><p>Optional player level</p><div class="levels"><button class="level" data-level="beginner">Getting started</button><button class="level" data-level="club">Club player</button><button class="level" data-level="competitive">Competitive</button><button class="level" data-level="skip">Skip</button></div></section>`;}
function cdText(){const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);const mins=Math.max(1,Math.round((m-n)/6e4));return mins>=60?`${Math.floor(mins/60)}h ${mins%60}m`:`${mins}m`;}
const hero=done=>`<div class="cine-hero"><div class="cine-promise">See clearer. <span>Think sharper.</span></div>${done?"":`<div class="cine-tag">One three-minute tennis decision a day.</div>`}<button class="cine-sound" data-gs-sound type="button"></button></div>`;
function today(){
 const L=A.todays(),nx=A.nextDaily(),N=A.CAT.daily.length;
 if(!L)return hero()+`<section class="today cine-card"><div class="cine-label">All ${N} played</div><h1 class="cine-title">You've played every lesson</h1><p class="cine-sit">New lessons are on the way. Until then, sharpen a part of your game or predict a point.</p><a class="btn cine-cta" href="?review=1">Sharpen your game <span>→</span></a><div class="cine-sub"><a href="${href(A.CAT.predict[0])}">Predict the Point</a> · <a href="?all=1">Explore lessons</a></div></section>`;
 const idx=A.CAT.daily.indexOf(L)+1,d=S.done[L.slug],n=A.streakNow();
 if(d&&d.first===A.today())return hero(1)+`<section class="today cine-card is-done"><div class="cd-top"><div class="cine-label">Done today${dots3(d)}</div><span class="cd-next">Next in <b id="cineCd">${cdText()}</b></span></div><h1 class="cine-title">${n>1?`${n}-day streak.`:"Day one done."}</h1><p class="note">${nx?`Tomorrow: <b>${esc(nx.title)}</b>`:"That was the last one for now. New lessons are on the way."}</p><div class="row cine-row">${nx?`<a class="btn cine-cta" id="more" href="${href(nx)}">Play next lesson <span>→</span></a>`:""}${A.CAT.play&&A.CAT.play[0]?`<a class="btn cine-ghost" id="playPoint" href="${href(thisWeek())}">Saturday Point</a>`:`<a class="btn cine-ghost" href="${href(L)}">Replay</a>`}</div></section>`;
 return hero()+`<section class="today cine-card"><div class="cine-label">Today's challenge · Lesson ${idx} of ${N} · 3 min</div><h1 class="cine-title">${esc(L.title)}</h1>${L.sit?`<p class="cine-sit">${esc(L.sit)}</p>`:""}<a class="btn cine-cta" href="${href(L)}">Play today's challenge <span>→</span></a><div class="cine-sub"><a href="?all=1">Explore lessons</a></div>${S.migrated&&!Object.keys(S.done).length?`<p class="note">Your ${S.migrated}-day streak carries over. Play today to keep it.</p>`:""}</section>`;
}
function predict(){const PL=A.CAT.predict,P=PL.find(l=>!S.done[l.slug])||PL[Math.floor(Date.now()/864e5)%PL.length],d=S.done[P.slug];   /* Claude 29 Sep: first unplayed Predict the Point, then one a day */return `<section class="daily-card ptp-sibling"><div class="daily-inner ptp-inner"><div class="daily-top"><div class="daily-label">Predict the Point</div></div><h2 class="ptp-question">Read the rally — where's the ball going next?</h2>${d?`<div class="predict-status">Played${dots3(d)}</div>`:""}<a class="btn ptp-cta" href="${href(P)}">Predict the Point →</a></div></section>`;}
function taster(){   /* Claude 30 Sep: one lesson from each flavour, so testers can sample the whole app and tell us what they want more of */
 const F=(A.CAT.flavours||[]).filter(f=>f.key!=="predict"); if(!F.length)return "";
 const T=A.todays(), pick=f=>{const ls=f.lessons.map(A.bySlug).filter(Boolean);return ls.find(l=>!S.done[l.slug]&&l!==T)||ls.find(l=>l!==T)||ls[0];};   // not today's lesson: that has its own card
 const rows=F.map(f=>{const l=pick(f);if(!l)return "";const d=S.done[l.slug];return `<a class="card" data-flavour="${esc(f.key)}" href="${href(l)}"><div class="num">${d?"✓":"›"}</div><div><div class="t">${esc(f.name)}</div><div class="d">${esc(l.title)}</div></div><div class="go">3 min →</div></a>`;}).join("");
 return `<section class="supplement gs-taster"><div class="library-head"><h2>Try each kind</h2><span>${F.length} kinds</span></div><div class="lib">${rows}</div></section>`;

const thisWeek=()=>{const pts=(A.CAT.play||[]).filter(p=>p.uses);return pts.find(p=>!S.done[p.slug])||pts[pts.length-1]||(A.CAT.play||[])[0];};

  return `<a class="supplement gs-play" href="${href(P)}"><div class="k">This week's point</div><b>${esc(P.title)}</b><span>${esc(P.line)}</span>${u.length?`<span class="gs-play-prog">${n} of ${u.length} lessons played${miss.length?` · still to play: ${miss.map(m=>esc(m.title)).join(", ")}`:" · you're ready"}</span>`:""}<i>${d?"Play the point again →":"Play →"}</i></a>`;}
function library(){
 const T=A.todays(),pool=ALL||REVIEW?[...A.CAT.daily,...A.CAT.predict,...(A.CAT.play||[]).filter(p=>p!==thisWeek())]:A.CAT.daily,open=pool.filter(l=>ALL||S.done[l.slug]),items=open.filter(l=>ALL||REVIEW||l!==T).map(l=>{const d=S.done[l.slug],i=A.CAT.daily.indexOf(l)+1;return `<a class="card" href="${href(l)}"><div class="num">${i||"P"}</div><div><div class="t">${esc(l.title)}</div><div class="d">${esc(l.line)}</div></div><div class="go">${d?`✓${dots3(d)}`:"3 min →"}</div></a>`;}).join("");
 if(!items)return REVIEW?`<section class="supplement"><h1>Sharpen</h1><p>Your played lessons will appear here for another go.</p><a class="gs-lesson-picker" href="./">Play today's challenge →</a></section>`:"";
 return (ALL&&A.CAT.play&&A.CAT.play[0]?playCard():"")+`<section class="supplement"><div class="library-head"><${ALL||REVIEW?"h1":"h2"}>${ALL?"Explore lessons":REVIEW?"Play again":"Your lessons"}</${ALL||REVIEW?"h1":"h2"}><span>${open.length} lesson${open.length===1?"":"s"}</span></div><div class="lib">${items}</div>${ALL?`<p class="gs-credits">Credits: swings are adapted from Tennis-MoCap (Pulgar&iacute;n-Giraldo et al., <a href="https://github.com/jdpulgarin/Tennis-MoCap">source</a>, <a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a>), edited and placed on court. The racquet, running and ball flight are modelled.</p>`:""}</section>`;
}
function paint(){streak();const cine=!(ALL||REVIEW);document.body.classList.toggle("cine-on",cine);if(cine&&window.GSCine&&!window.__cine)window.__cine=GSCine($("cineCourt"));$("homeScreen").classList.toggle("library-view",ALL||REVIEW);$("main").innerHTML=legacyNotice()+(REVIEW&&window.GS_SHARPEN?GS_SHARPEN.render(A,S,href,dots3,esc)+(new URLSearchParams(location.search).get("z")||!Object.keys(S.done||{}).length?"":library()):ALL||REVIEW?library():today())   /* one door: Predict the Point and the taster row live in Explore / Sharpen */+first();document.querySelectorAll("[data-flavour]").forEach(a=>a.addEventListener("click",()=>A.track("taster_open",{flavour:a.dataset.flavour})));document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{A.setLevel(b.dataset.level);levelOpen=false;paint();});const m=$("more");if(m)m.onclick=()=>A.track("asked_more",{next:A.nextDaily().slug});const pp=$("playPoint");if(pp)pp.onclick=()=>A.track("play_point_open",{from:"home"});if(window.GSSfx)GSSfx.wire($("main"));if(REVIEW&&window.GS_SHARPEN&&GS_SHARPEN.mount)GS_SHARPEN.mount();const cd=$("cineCd");if(cd){clearInterval(window.__cdT);window.__cdT=setInterval(()=>{cd.textContent=cdText();},30000);}document.querySelectorAll('[data-nav]').forEach(a=>{const on=a.dataset.nav===(ALL?"Explore":REVIEW?"Sharpen":"Home");a.classList.toggle('gs-nav-active',on);a.classList.toggle('gs-bnav-active',on);if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});}

if(q.has('debug'))$("log").textContent=`id ${S.id} · first ${S.first} · app ${A.VER}\n`+A.log().slice(-40).map(e=>e.join("  ")).join("\n");
})();
