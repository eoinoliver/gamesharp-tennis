.cine-bg{display:none}

.cine-label{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cine-title{margin:6px 0 4px;font-size:clamp(20px,5.6vw,30px);line-height:1.12;color:#f4f1e8;letter-spacing:-.01em}

.cine-row{display:grid;grid-template-columns:1fr auto;gap:8px}

.cine-card.is-done{padding:12px 14px;border-radius:16px}

@keyframes cineIn{from{opacity:0;transform:translateY(10px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

<script>
(function(){
const A=GSApp,S=A.S,$=id=>document.getElementById(id),q=new URLSearchParams(location.search),ALL=q.has("all"),REVIEW=q.has("review");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const href=l=>`play.html?l=${l.slug}`;
const dots3=d=>d?`<span class="done3" role="img" aria-label="Best score: ${d.best} of ${d.bestTotal||d.total||3} correct">${Array.from({length:d.bestTotal||d.total||3},(_,i)=>i).map(i=>`<i class="${i<d.best?"ok":""}"></i>`).join("")}</span>`:"";
const legacyEntry=["goldDaily","challenge","p","play","ch","legacy"].some(k=>q.has(k));
const legacyNotice=()=>legacyEntry?`<section class="supplement" aria-label="Previous app link"><div class="k">GameSharp has changed</div><p>This link belongs to the previous app. Its original activity isn't available in this version.</p><a class="gs-lesson-picker" href="./?all=1">Browse current lessons →</a></section>`:"";
/* Home is the daily invitation. Explicit legacy ?auto lesson URLs still work. */
A.opened("home");
function streak(){const n=A.streakNow();$("streak").textContent=n?`${n} day${n>1?"s":""}`:"";}
let levelOpen=false;
function first(){if(!levelOpen)return "";return `<section class="first supplement" id="player-level"><b>What's your game?</b><p>Optional player level</p><div class="levels"><button class="level" data-level="beginner">Getting started</button><button class="level" data-level="club">Club player</button><button class="level" data-level="competitive">Competitive</button><button class="level" data-level="skip">Skip</button></div></section>`;}
function cdText(){const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);const mins=Math.max(1,Math.round((m-n)/6e4));return mins>=60?`${Math.floor(mins/60)}h ${mins%60}m`:`${mins}m`;}
const hero=L=>`<figure id="cineCourt" class="daily-picture"><img src="home/${encodeURIComponent(L.slug)}.jpg?v=${A.VER}" width="820" height="470" alt="" fetchpriority="high"><video muted playsinline preload="none" aria-hidden="true" data-src="home/${encodeURIComponent(L.slug)}.mp4?v=${A.VER}"></video><button type="button" class="preview-control" aria-label="Play court preview"></button></figure>`;
function previousScore(slug){const d=A.previousEdition(slug)?.done;return d?`Earlier edition: ${d.best} of ${d.bestTotal||d.total||3} best · saved`:"";}
function shareDaily(F){return `<div class="daily-share"><button type="button" class="daily-share-button" id="shareDaily">Share challenge ↗</button><div id="dailyShareFallback" hidden><label for="dailyShareLink">Challenge link</label><input id="dailyShareLink" readonly value="${esc(A.dailyShareUrl(F.lesson.slug))}"><button type="button" id="copyDaily">Copy link</button></div><p id="dailyShareStatus" role="status"></p></div>`;}
function today(){
 const F=A.featuredDaily();if(!F)return `<section class="today cine-card"><h1>Find your next challenge</h1><a class="btn cine-cta" href="?all=1">Explore practice →</a></section>`;
 const L=F.lesson,copy=A.CAT.dailyPlan.home[L.slug],related=F.done&&A.relatedPoint(L.slug);
 const date=new Date(F.date+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'});
 const intro=!Object.keys(S.done).length?'&intro=1':'';
 const label=F.done?"Today's challenge · complete":"Today's challenge";
 const action=F.previouslyPlayed?'Replay this challenge':F.seen?'Continue this challenge':"Play today’s challenge";
 const main=`<section class="today cine-card${F.done?' is-done':''}" data-featured="${esc(L.slug)}"><div class="daily-kicker"><span>${label}</span><time datetime="${F.date}">${esc(date)}</time></div>${F.done?`<div class="daily-complete"><h1 class="cine-title">Take this onto court.</h1><p class="daily-cue">${esc(window.GSSfx?.courtCue(L.slug)||L.cue||'Keep one decision in mind at your next match.')}</p><div class="daily-actions"><a class="daily-replay" href="${href(L)}&challenge=daily" aria-label="Replay ${esc(A.displayTitle(L))}">Replay challenge</a>${shareDaily(F)}</div>${related?`<a class="btn cine-cta" id="livePoint" data-related-from="${esc(L.slug)}" href="${href(related.lesson)}&from=daily&lesson=${encodeURIComponent(L.slug)}" title="${esc(related.bridge)}">Try a related Live Point <span aria-hidden="true">→</span></a>`:''}<p class="daily-next">Tomorrow’s pick in <b id="cineCd">${cdText()}</b></p></div>`:`<div class="daily-feature-grid">${hero(L)}<div class="daily-copy"><h1 class="cine-title">${esc(copy.title)}</h1><p class="cine-sit">${esc(copy.setup)}</p><div class="daily-meta"><span>About 3 minutes</span>${F.previouslyPlayed?'<span class="daily-revisit">Revisit · earlier result saved</span>':''}</div><a class="btn cine-cta" id="todayChallenge" href="${href(L)}&challenge=daily${intro}">${action} <span aria-hidden="true">→</span></a></div></div>`}${S.migrated&&!Object.keys(S.done).length?`<p class="note">Your ${S.migrated}-day streak carries over. Play today to keep it.</p>`:''}</section>`;
 return main+`<nav class="home-play" aria-label="More ways to play"><a id="homeSingles" href="?all=1&kind=live"><span><b>Play singles</b><small>Live points</small></span><i aria-hidden="true">→</i></a><a id="homeDoubles" href="?all=1&kind=doubles"><span><b>Play doubles</b><small>Play and share</small></span><i aria-hidden="true">→</i></a></nav>`;
}
function practiceEntry(kind){
 if(kind==='daily'){
  const next=A.nextDaily();return next?`<a id="more" class="practice-entry" href="${href(next)}"><span class="k">Your next challenge</span><b>${esc(A.CAT.dailyPlan.home[next.slug]?.title||A.displayTitle(next))}</b><span>Play →</span></a>`:'';
 }
 if(kind!=='live')return '';
 const next=A.nextLivePoint();if(!next||next.doubles)return '';
 const old=A.previousEdition(next.slug),seen=S.seen?.[next.slug];
 const label=next.transferOf?'A new situation':old?'Updated Live Point':seen?'Continue your point':'Start with this point';
 return `<a class="practice-entry" id="${next.transferOf?'returnLivePoint':'resumeLivePoint'}" href="${href(next)}"><span class="k">${label}</span><b>${esc(A.displayTitle(next))}</b><span>${next.transferOf?'Make your calls before seeing the cue.':esc(A.activityLabel(next))}${old?' · '+esc(previousScore(next.slug)):''} →</span></a>`;
}
let featuredImpression=null;
function wireDaily(){
 const F=A.featuredDaily(),button=$('shareDaily');
 if(!F)return;const impression=F.date+':'+F.lesson.slug+':'+F.done;if(impression!==featuredImpression){featuredImpression=impression;A.track('featured_daily_view',{lesson:F.lesson.slug,date:F.date,edition:F.edition,complete:F.done,revisit:F.previouslyPlayed});}
 $('todayChallenge')?.addEventListener('click',()=>A.track('featured_daily_start',{lesson:F.lesson.slug,date:F.date,edition:F.edition,revisit:F.previouslyPlayed}));
 document.querySelector('[data-related-from]')?.addEventListener('click',e=>A.track('daily_to_live',{from:e.currentTarget.dataset.relatedFrom,to:A.relatedPoint(F.lesson.slug)?.lesson.slug}));
 if(!button)return;
 const status=$('dailyShareStatus'),link=A.dailyShareUrl(F.lesson.slug),fallback=$('dailyShareFallback');
 button.onclick=async()=>{A.track('daily_share_intent',{lesson:F.lesson.slug,date:F.date});if(!navigator.share){fallback.hidden=false;return;}try{await navigator.share({title:'What would you play?',text:'Make your own call on this GameSharp Tennis challenge.',url:link});status.textContent='Challenge shared.';A.track('daily_shared',{lesson:F.lesson.slug,method:'native'});}catch(e){if(e.name==='AbortError')status.textContent='Share cancelled.';else fallback.hidden=false;}};
 $('copyDaily').onclick=async()=>{try{await navigator.clipboard.writeText(link);status.textContent='Link copied. Your answers are not included.';A.track('daily_shared',{lesson:F.lesson.slug,method:'copy'});}catch(e){$('dailyShareLink').select();status.textContent='Select and copy the link above.';}};
}
function taster(){   /* Claude 30 Sep: one lesson from each flavour, so testers can sample the whole app and tell us what they want more of */
 const F=(A.CAT.flavours||[]).filter(f=>f.key!=="predict"); if(!F.length)return "";
 const T=A.todays(), pick=f=>{const ls=f.lessons.map(A.bySlug).filter(Boolean);return ls.find(l=>!S.done[l.slug]&&l!==T)||ls.find(l=>l!==T)||ls[0];};   // not today's lesson: that has its own card
 const rows=F.map(f=>{const l=pick(f);if(!l)return "";const d=S.done[l.slug];return `<a class="card" data-flavour="${esc(f.key)}" href="${href(l)}"><div class="num">${d?"✓":"›"}</div><div><div class="t">${esc(f.name)}</div><div class="d">${esc(A.displayTitle(l))}</div></div><div class="go">3 min →</div></a>`;}).join("");
 return `<section class="supplement gs-taster"><div class="library-head"><h2>Try each kind</h2><span>${F.length} kinds</span></div><div class="lib">${rows}</div></section>`;
}
/* Play the Point (5 Oct): one branching point, featured at the top of Explore */
/* 8 Oct: little and often. Monday to Thursday Home features the Midweek Point (three shots), Friday to Sunday the
   Saturday Point (five); each time the first one you haven't played, else the newest of that kind. */
const isMid=p=>p&&p.slug.startsWith("midweek-");
const thisWeek=()=>{const pts=(A.CAT.play||[]).filter(p=>p.uses),d=new Date().getDay(),mid=d>=1&&d<=4;
  const kind=pts.filter(p=>isMid(p)===mid), pool=kind.length?kind:pts;
  return pool.find(p=>!S.done[p.slug])||pool[pool.length-1]||(A.CAT.play||[])[0];};
function playCard(){const P=thisWeek(),d=S.done[P.slug],u=P.uses||[],n=u.filter(s=>S.done[s]).length,miss=u.filter(s=>!S.done[s]).map(s=>A.bySlug(s)).filter(Boolean);
