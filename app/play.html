<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GameSharp Tennis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&display=swap">
<style>
/* Layout and hierarchy copied from the live app's Daily lesson (gold-daily-prototypes.css,
   "approved coaching hierarchy"); the 3D stage replaces the court map. */
:root{
  color-scheme:dark;
  --gold:#c8a84b; --lime:#d3e267; --green:#59bd70; --red:#e07070;
  --ink:#f0ece3; --line:rgba(255,255,255,.12);
  --court:#132914; --court-in:#1e5a22; --court-line:rgba(233,240,225,.78);
  --ball:#d2e83a; --accent:#c8a84b; --warn:#e05252;
}
*{box-sizing:border-box}
html{background:#090a09}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
  background:radial-gradient(90% 52% at 50% 7%,rgba(39,89,48,.34),transparent 74%),linear-gradient(180deg,#0b160e 0%,#0a0f0b 58%,#090a09 100%) no-repeat}
button{font:inherit}
.shell{width:min(100%,680px);margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(26px + env(safe-area-inset-bottom))}
@media(min-width:700px){.shell{padding-left:24px;padding-right:24px}}

/* header: back · brand · close */
.head{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;min-height:48px;margin-bottom:8px}
.brand{text-align:center;font-family:"Bebas Neue","Arial Narrow",sans-serif;font-size:19px;letter-spacing:2.7px;white-space:nowrap}
.brand span{color:var(--gold)}
.ico{width:44px;height:44px;border:1px solid rgba(255,255,255,.13);border-radius:50%;background:rgba(255,255,255,.035);
  color:var(--ink);display:grid;place-items:center;cursor:pointer;text-decoration:none;font-size:18px;line-height:1}
.ico:active{transform:scale(.96)}
:focus-visible{outline:3px solid var(--lime);outline-offset:3px}

/* lesson name · count */
.meta{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;margin:1px 0 10px}
.meta .name{font-size:13px;line-height:1.3;color:var(--gold);font-weight:700;letter-spacing:.2px}
.meta .count{font-size:12px;color:rgba(255,255,255,.55);white-space:nowrap}
.setup{margin:0 0 12px;font-size:16px;line-height:1.4;color:rgba(255,255,255,.9);text-wrap:pretty;min-height:2.8em}

/* the visual card: cue rail + tools, the 3D stage, the ink line */
.visual{position:relative;overflow:hidden;border:1px solid rgba(111,205,130,.21);border-radius:17px;
  background:radial-gradient(95% 82% at 50% 43%,#174b22 0%,#0b2511 66%,#071309 100%);
  box-shadow:inset 0 0 42px rgba(0,0,0,.22),0 13px 30px rgba(0,0,0,.22)}
.tools{display:grid;grid-template-columns:minmax(0,1fr) 44px 44px 44px 44px;align-items:center;min-height:44px;padding-left:10px;
  border-bottom:1px solid rgba(255,255,255,.07);background:rgba(2,10,4,.22)}
.rail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;gap:5px;min-width:0;
  color:rgba(255,255,255,.43);font-size:8.5px;font-weight:800;letter-spacing:.22px;text-transform:uppercase}
.rail span{min-width:0;line-height:1.12;text-align:center;opacity:0;transform:translateY(3px);transition:opacity .26s,transform .26s}
.rail span:first-child{text-align:left}
.rail span.on{opacity:.72;transform:none}
.rail span.on:last-child{opacity:.96;color:rgba(228,218,172,.88)}
.tbtn{width:44px;height:44px;border:0;border-left:1px solid rgba(255,255,255,.07);background:transparent;color:rgba(240,236,227,.7);
  cursor:pointer;display:grid;place-items:center;padding:0}
.tbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tbtn:active{background:rgba(255,255,255,.045)}
.stage{position:relative;touch-action:manipulation;cursor:pointer}
.stage svg{display:block;width:100%;height:auto}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(4,17,7,.82);border:1px solid rgba(255,255,255,.14);
  border-radius:999px;padding:5px 12px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.scorechip{position:absolute;left:10px;top:10px;padding:4px 9px;border-radius:7px;background:rgba(4,17,7,.78);border:1px solid rgba(200,168,75,.45);
  color:#f0ece3;font-family:"Bebas Neue",Impact,sans-serif;font-size:17px;letter-spacing:.06em;pointer-events:none}
.scorechip b{color:var(--gold);font-weight:400}
.paused{position:absolute;right:10px;bottom:10px;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(240,236,227,.75);background:rgba(4,17,7,.7);border-radius:6px;padding:4px 7px;pointer-events:none}
.ink{min-height:34px;padding:3px 9px 7px;background:#08170b;text-align:center}
#ink{display:inline-block;padding:5px 10px 4px;border-bottom:1px solid rgba(211,226,103,.72);color:#eef2d4;
  font-family:Georgia,serif;font-size:15px;font-style:italic;font-weight:700;clip-path:inset(0 100% 0 0)}
#ink.on{animation:inkWrite .42s cubic-bezier(.22,.78,.25,1) forwards}
#ink.miss{border-bottom-color:rgba(224,112,112,.8);color:#f3d6d6}
@keyframes inkWrite{from{clip-path:inset(0 100% 0 0);filter:blur(1px)}to{clip-path:inset(0);filter:none}}

/* decision zone */
.zone{padding-top:12px}
.q{font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.35px;margin:0 0 12px;text-wrap:pretty}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.opt{width:100%;min-height:58px;padding:8px 9px;border:1px solid rgba(255,255,255,.12);border-radius:13px;background:rgba(255,255,255,.037);
  color:rgba(255,255,255,.88);display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:center;text-align:left;cursor:pointer;
  font-size:13.5px;line-height:1.28;transition:opacity .3s,filter .3s,transform .3s}
.opt .l{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:rgba(255,255,255,.07);color:rgba(255,255,255,.7);font-size:11px;font-weight:800}
.opt:not(:disabled):active{transform:scale(.992);border-color:rgba(211,226,103,.42)}
.opt:not(:disabled):hover{border-color:rgba(211,226,103,.42)}
.opt:disabled{cursor:default}
.zone.reading .q{opacity:.62}
.zone.reading .opt{opacity:.30;filter:saturate(.62);transform:translateY(4px)}
.opt.right{border-color:rgba(89,189,112,.82);background:rgba(89,189,112,.12);color:#fff}
.opt.right .l{background:var(--green);color:#071109}
.opt.wrong{border-color:rgba(224,112,112,.74);background:rgba(224,112,112,.10)}
.opt.wrong .l{background:var(--red);color:#170707}
.opt.hide{display:none}
.w{opacity:0;transition:opacity .28s ease}.w.on{opacity:1}
.setup .w.hot{color:#f3d68a}
.opt.picked{border-color:rgba(200,168,75,.85);background:rgba(200,168,75,.12);color:#fff}
.opt.picked .l{background:var(--gold);color:#120e04}
.review{margin:10px 0 0;padding:10px 0 0;border-top:1px solid rgba(255,255,255,.08)}
.review .rq{font-size:12px;opacity:.7;margin:0 0 2px}
.review .ra{margin:0 0 4px}
.review .ok{color:#8fd49a}.review .no{color:#f08a8a}
.review button{margin-top:4px}

/* feedback */
.fb{margin:10px 0 0;padding:11px 13px;border-left:2px solid var(--green);border-radius:4px 13px 13px 4px;background:rgba(89,189,112,.075);animation:rise .32s ease-out both}
.fb.miss{border-left-color:var(--gold);background:rgba(200,168,75,.065)}
.fb .lab{margin-bottom:5px;color:var(--green);font-size:9.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase}
.fb.miss .lab{color:var(--gold)}
.fb .copy{color:rgba(255,255,255,.84);font-size:14px;line-height:1.48}
.fb .prin{margin-top:6px;color:rgba(255,255,255,.58);font-size:12.5px;line-height:1.48}
.fb .tries{display:inline-block;margin:0 0 7px;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700}
.tries.good{background:rgba(89,189,112,.14);color:#8fd49c}.tries.mid{background:rgba(200,168,75,.14);color:var(--gold)}.tries.bad{background:rgba(224,112,112,.14);color:#f0a0a0}
.fbh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-7px -6px 1px 0}
.fbh .lab{margin:0}
.fbh .tries{margin:0 auto 0 0}
.why{min-width:62px;min-height:34px;margin:0;padding:5px 8px;border:0;background:transparent;color:var(--gold);cursor:pointer;
  font-size:12px;font-weight:800;letter-spacing:.4px;text-align:left}
.why span{display:inline-block;margin-left:3px;font-size:15px}
.whyp{margin-top:8px;padding-top:10px;border-top:1px solid rgba(255,255,255,.09);color:rgba(255,255,255,.6);font-size:12px;line-height:1.5}
.whyp p{margin:0 0 6px}
.acts{display:flex;gap:10px;align-items:center;margin:10px 0 0}
.acts .next{flex:1;margin:0}
.acts .alt{margin:0;flex:0 1 auto;text-align:left}
.next{width:100%;min-height:50px;margin:12px 0 0;border:0;border-radius:16px;background:var(--gold);color:#10130c;display:block;cursor:pointer;font-weight:800;font-size:14px;animation:rise .32s ease-out both}
.alt{display:block;margin:8px auto 0;min-height:40px;border:0;background:none;color:rgba(240,236,227,.66);font-size:13px;font-weight:600;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px}
.alt:hover{color:var(--ink)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* wrap-up */
.wrapup{margin-top:4px}
.wrapup .k{font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;font-weight:800;color:var(--gold)}
.wrapup .mem{font-family:"Bebas Neue",Impact,sans-serif;font-size:clamp(28px,7vw,36px);letter-spacing:.03em;line-height:1.02;margin:6px 0 14px;text-wrap:balance}
.wrapup .mem span{color:var(--gold)}
.wrapup .blk{border-top:1px solid rgba(255,255,255,.09);padding-top:12px;margin-top:12px}
.wrapup p{margin:5px 0 0;font-size:14px;line-height:1.5;color:rgba(255,255,255,.72)}
.wrapup p b{color:var(--ink);font-weight:600}
.wrapup .src{font-size:11.5px;color:rgba(255,255,255,.45)}
.wrapup a{color:var(--gold)}
.pays{margin-top:14px;border-top:1px solid rgba(255,255,255,.09)}
details.pay{border-bottom:1px solid rgba(255,255,255,.09)}
details.pay summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;min-height:48px;gap:10px}
details.pay summary::-webkit-details-marker{display:none}
details.pay .pl{color:var(--gold);font-size:20px;line-height:1;transition:transform .2s}
details.pay[open] .pl{transform:rotate(45deg)}
details.pay .pbody{padding:0 0 14px;animation:rise .25s ease-out both}
details.pay .pbody p:first-child{margin-top:0}
.strip{display:grid;grid-template-columns:auto repeat(3,1fr);gap:4px 4px;align-items:center;margin:2px 0 10px}
.strip img{width:100%;border-radius:8px;display:block}
.strip .ch{font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;font-weight:800;color:rgba(255,255,255,.5);text-align:center}
.strip .rh{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;font-weight:800;color:var(--gold)}
.cuebox{margin-top:16px;padding:14px;border:1px solid rgba(200,168,75,.35);border-radius:14px;background:rgba(200,168,75,.06)}
.cuebox .cue{font-family:"Bebas Neue",Impact,sans-serif;font-size:26px;letter-spacing:.03em;line-height:1.05;margin:6px 0 12px}
.savecue{width:100%;min-height:44px;border:1px solid var(--gold);border-radius:12px;background:transparent;color:var(--gold);font-weight:800;font-size:14px;cursor:pointer}
.savecue.on{background:rgba(89,189,112,.12);border-color:rgba(89,189,112,.7);color:#8fd49c;cursor:default}
.wrapup .credit{margin-top:22px;font-size:11px;line-height:1.5;color:rgba(255,255,255,.38)}
.wrapup .credit a{color:inherit}
.score3{display:flex;gap:6px;margin:2px 0 0}
.score3 i{width:22px;height:4px;border-radius:999px;background:rgba(255,255,255,.13)}
.score3 i.ok{background:var(--green)}.score3 i.no{background:var(--gold)}

/* full screen: watch only, with clear controls clear of the notch */
.visual.full .tools,.visual:fullscreen .tools{position:absolute;z-index:3;bottom:auto;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));left:auto;
  display:flex;min-height:0;padding:0;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(4,17,7,.72)}
.visual.full .tools .rail,.visual:fullscreen .tools .rail{display:none}
.visual.full .tbtn,.visual:fullscreen .tbtn{width:46px;height:46px;border-left:0;color:#f0ece3}
.visual.full .tbtn svg,.visual:fullscreen .tbtn svg{width:21px;height:21px}
/* full screen: watch only */
.visual.full,.visual:fullscreen{position:fixed;inset:0;z-index:50;border-radius:0;border:0;display:flex;flex-direction:column;
  padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.visual.full .stage,.visual:fullscreen .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.visual.full .stage svg,.visual:fullscreen .stage svg{width:100%;height:100%}
body.noscroll{overflow:hidden}

details.note{margin-top:30px;border-top:1px solid rgba(255,255,255,.08);padding-top:12px}
details.note summary{cursor:pointer;font-size:12px;color:rgba(255,255,255,.45);list-style:none;min-height:32px}
details.note summary::-webkit-details-marker{display:none}
details.note summary::after{content:" +";color:var(--gold)}
details.note[open] summary::after{content:" \2013"}
details.note p{margin:8px 0 0;font-size:12px;line-height:1.6;color:rgba(255,255,255,.55)}
details.note b{color:var(--ink);font-weight:500}
details.note a{color:var(--gold)}
[hidden]{display:none!important}
/* phone: the whole decision on one screen (no scrolling to answer or to reach Next) */
@media(max-width:600px){
  .shell{padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .head{min-height:40px;margin-bottom:4px;grid-template-columns:40px minmax(0,1fr) 40px}
  .ico{width:40px;height:40px;font-size:16px}
  .brand{font-size:17px}
  .meta{margin:0 0 5px}
  .setup{font-size:15px;line-height:1.35;margin:0 0 8px;min-height:2.7em}
  .tools{position:absolute;top:auto;bottom:32px;right:0;z-index:2;display:flex;min-height:0;padding:0;border:0;background:none}
  .paused{right:auto;left:10px;bottom:40px}
  .tbtn{width:38px;height:38px;border:0;color:rgba(240,236,227,.62)}
  .ink{min-height:32px;padding:3px 10px 5px;display:grid;align-items:center}
  .ink .rail{font-size:9px;gap:6px}.ink .rail span:first-child{text-align:center}
  .ink.has .rail{display:none}.ink:not(.has) #ink{display:none}
  #ink{font-size:14px;padding:4px 10px 3px;justify-self:center}
  .zone{padding-top:9px}
  .q{font-size:19px;margin:0 0 9px}
  .fb{margin-top:8px;padding:9px 12px}
  .fb .copy{font-size:13.5px;line-height:1.42}
  .fb .prin{margin-top:4px;font-size:12px;line-height:1.42}
  .zone.ans .q{display:none}
  .zone.ans .opt{min-height:46px;padding:6px 9px}
  .acts{margin-top:8px}.next{min-height:46px;border-radius:14px}
}
@media(max-width:360px){.shell{padding-left:12px;padding-right:12px}.rail{font-size:7px;gap:2px}.opt{font-size:13px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}
  .rail span{opacity:.72;transform:none}#ink{clip-path:none}}
</style>

</head>
<body>
<div class="shell">
  <header class="head">
    <button class="ico" id="back" aria-label="Back">&#8592;</button>
    <div class="brand">GAME<span>SHARP</span></div>
    <a class="ico" id="close" href="./" aria-label="Close">&#215;</a>
  </header>

  <div id="lessonView">
    <div class="meta"><span class="name" id="lessonName"></span><span class="count" id="count"></span></div>
    <p class="setup" id="sitTx"></p>

    <div class="visual" id="viewer">
      <div class="tools" id="tools">
        <div class="rail" id="rail" aria-hidden="true"></div>
        <button class="tbtn" id="playBtn" aria-label="Pause"><svg viewBox="0 0 24 24" id="playIcon"></svg></button>
        <button class="tbtn" id="camBtn" aria-label="Change camera"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
        <button class="tbtn" id="fsBtn" aria-label="Full screen"><svg viewBox="0 0 24 24" id="fsIcon"></svg></button>
        <button class="tbtn" id="again" aria-label="Replay"><svg viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></svg></button>
      </div>
      <div class="stage" id="stage">
        <svg id="svg" viewBox="0 0 820 470" role="img" aria-label="3D replay of the point"></svg>
        <div class="toast" id="toast"></div>
        <div class="paused" id="paused" hidden>Paused</div>
        <div class="scorechip" id="scorechip" hidden></div>
      </div>
      <div class="ink" id="inkRow"><span id="ink"></span></div>
    </div>

    <section class="zone reading" id="ask" aria-live="polite">
      <h1 class="q" id="askQ"></h1>
      <div class="opts" id="askOpts"></div>
      <div id="verdict" hidden></div>
    </section>
  </div>

  <div class="wrapup" id="wrapup" hidden></div>

</div>

<style>
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg,#111);color:rgba(240,236,227,.6);font:500 14px "DM Sans",sans-serif;z-index:50}
#loading.err{color:var(--ink,#f0ece3);padding:24px;text-align:center;line-height:1.5}
#loading a{color:var(--gold,#c8a84b)}
.appblk{border-top:1px solid rgba(255,255,255,.09);padding-top:12px;margin-top:12px}
.appblk .strk{font-size:14px;color:rgba(255,255,255,.72);margin:5px 0 0}
.appblk .strk b{color:var(--gold,#c8a84b)}
.fbq{margin-top:10px;font-size:14px;color:var(--ink,#f0ece3);font-weight:600}
.fbrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.fbrow button{flex:1 1 120px;min-height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:transparent;color:var(--ink,#f0ece3);font:600 14px "DM Sans",sans-serif;cursor:pointer}
.fbrow button:hover{border-color:var(--gold,#c8a84b)}
.fbtx{width:100%;margin-top:10px;min-height:70px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);color:var(--ink,#f0ece3);font:14px "DM Sans",sans-serif;padding:10px 12px;resize:vertical}
.fbthanks{margin-top:8px;font-size:14px;color:rgba(255,255,255,.72)}
.wrapup a.home{display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:14px;color:#16130a}
.wrapup .fbwrap{flex-wrap:wrap}
.wrapup #redo{background:transparent;color:var(--ink,#f0ece3);border:1px solid rgba(255,255,255,.18)}
#loading .ld-in{display:grid;justify-items:center;gap:14px}
#loading .ld-logo{font:28px "Bebas Neue",Impact,sans-serif;letter-spacing:.14em;color:#f4f1e8}#loading .ld-logo span{color:var(--gold,#c8a84b)}
#loading .ld-tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:rgba(244,241,232,.55)}
#loading .ld-ball{width:12px;height:12px;border-radius:50%;background:#e3f25a;box-shadow:0 0 14px rgba(227,242,90,.6);animation:ldB .62s cubic-bezier(.4,0,.6,1) infinite alternate}
#loading .ld-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#loading.out{opacity:0;transition:opacity .4s}
@keyframes ldB{from{transform:translateY(-22px)}to{transform:translateY(10px) scale(1.15,.82)}}
.gs-snd{position:absolute;right:10px;top:10px;z-index:3;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(4,17,7,.6);color:rgba(240,236,227,.8);display:grid;place-items:center;cursor:pointer;padding:0}
.gs-snd[aria-pressed=false]{color:rgba(240,236,227,.4)}
.visual.full .gs-snd,.visual:fullscreen .gs-snd{top:auto;bottom:max(12px,env(safe-area-inset-bottom))}

#gsw{position:fixed;inset:0;z-index:60;display:grid;place-items:center;overflow:hidden;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(80% 55% at 50% 40%,rgba(255,246,214,.09),rgba(0,0,0,0) 70%),linear-gradient(180deg,#030806 0%,#071a0d 45%,#04100a 100%);color:#f4f1e8}

@keyframes gswP{
  0%  {transform:rotate(-5deg) translateX(1px);color:#fff9e8;text-shadow:0 0 7px #fff5b0,0 0 20px rgba(200,168,75,.9),0 0 40px rgba(200,168,75,.4)}
  8%  {transform:rotate(-11deg) translateX(-3px) scaleX(.9) scaleY(1.1);color:#ffd96e;text-shadow:0 0 12px #fff5b0,0 0 28px rgba(200,168,75,.95),0 0 50px rgba(200,168,75,.5)}
  22% {transform:rotate(2deg) translateX(2px) scaleX(1.04);color:#e8b84b;text-shadow:0 0 5px rgba(200,168,75,.65)}
  40% {transform:rotate(-1deg) scaleX(1.01);color:#d4a645;text-shadow:0 0 2px rgba(200,168,75,.25)}
  65%,100%{transform:none;color:var(--gold,#c8a84b);text-shadow:none}}
@keyframes gswFocus{
  0%  {filter:blur(1.2px) brightness(1) contrast(1);opacity:.9}
  18% {filter:blur(.8px) brightness(.88) contrast(.95)}
  52% {filter:blur(0) brightness(1.16) contrast(1.08);opacity:1}
  100%{filter:none;opacity:1}}
@keyframes gswGlint{0%{opacity:0;background-position:110% 0}12%,80%{opacity:1}100%{opacity:0;background-position:-10% 0}}

@media (prefers-reduced-motion:reduce){#gsw *{animation:none!important;transition:none!important}}

<!-- Welcome: only on auto-started visits (?auto). Decided here, before the scripts load, so the plain loader never flashes first.
     The sport line is its own element so it can later cycle sports (TENNIS · GOLF); Tennis only for now. -->
<div id="gsw" aria-hidden="true" hidden><div class="gsw-in"><div class="gsw-mark">GAME<span>SHAR<em>P</em></span><div class="gsw-glint">GAME<span>SHAR<em>P</em></span></div></div><div class="gsw-sport">TENNIS</div><div class="gsw-promise">See clearer. Think sharper.</div></div><div class="gsw-ball"><svg viewBox="0 0 22 22"><defs><radialGradient id="gswb" cx="34%" cy="31%" r="65%"><stop offset="0%" stop-color="#f8ff68"/><stop offset="60%" stop-color="#d2e83a"/><stop offset="100%" stop-color="#8aab20"/></radialGradient></defs><circle cx="11" cy="11" r="9.5" fill="url(#gswb)"/><path d="M4.5,8 Q11,10 17.5,8" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.4" stroke-linecap="round"/><path d="M4,13.5 Q11,11.5 18,13.5" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.4" stroke-linecap="round"/></svg></div></div>
<script>
(function(){
  /* full: first auto-start of the calendar day (gs_welcome_day); short: later the same day; still: reduced motion */
  var w=document.getElementById("gsw"); if(!w||!new URLSearchParams(location.search).has("auto")) return;
  var d=new Date(), p=function(n){return String(n).padStart(2,"0");}, day=d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()), m="full";
  try{ if(matchMedia("(prefers-reduced-motion: reduce)").matches) m="still";
       else if(localStorage.getItem("gs_welcome_day")===day) m="short"; else localStorage.setItem("gs_welcome_day",day); }catch(e){ m="short"; }
  w.className=m; w.dataset.t0=performance.now(); w.hidden=false;
})();
</script>

<script>
(function(){
const A=GSApp, V="43ef05ec2d", slug=new URLSearchParams(location.search).get("l"), L=A.bySlug(slug), ld=document.getElementById("loading");
if(!L){location.replace("./?home=1");return;}
window.GS_HOME_URL="./?home=1";   /* Home never auto-starts a lesson when you come back from one */
const QS=new URLSearchParams(location.search);
/* An auto-started lesson replaced the bare Home visit, so give back/close a Home entry to return to:
   this page's entry becomes ./?home=1 and the lesson is pushed on top; going back to it loads Home. */
if(QS.has("auto")&&!(history.state&&history.state.gsLesson)){const here=location.href;history.replaceState({gsHome:1},"","./?home=1");history.pushState({gsLesson:1},"",here);}
addEventListener("popstate",e=>{if(e.state&&e.state.gsHome)location.replace("./?home=1");});
document.title=L.title+" · GameSharp";
/* Welcome timeline (full ~2.0 s): 0.15-1.10 s the ball rolls in from the right (P is the first letter it meets, as in V5) with two small bounces and slows into the P;
   1.10 s impact (P snaps straight, wordmark sharpens, gold glint, ball drops away); 1.10-1.60 s the promise fades up;
   1.60-2.00 s dissolve to the lesson, which has been loading underneath since 0 s. Short: glint, dissolve at 0.2 s.
   Not ready yet: hold the final frame with a soft pulse. A tap or key skips. */
const W=(()=>{
  const w=document.getElementById("gsw"); if(!w||w.hidden) return null;
  const mode=w.className, t0=+w.dataset.t0||performance.now(), mark=w.querySelector(".gsw-mark"), P=mark.querySelector("em"), ball=w.querySelector(".gsw-ball");
  const END={full:1600,short:200}[mode]||0, now=()=>performance.now()-t0;
  let ready=false, skipped=false, hit=false, done=false, gone=false, after=[];
  const add=c=>w.classList.add(c);
  function remove(){if(gone)return;gone=true;w.remove();after.splice(0).forEach(f=>f());}
  function finish(){
    if(done) return; done=true; removeEventListener("pointerdown",skip,true); removeEventListener("keydown",skip,true);
    try{A.track("welcome_seen",{full:mode==="full",skipped,ms:Math.round(now())});}catch(e){}
    if(!hit) add("set");
    /* a skip vanishes at once but keeps catching that tap's click for a moment, so it can't land on the lesson */
    if(skipped){add("gone");w.addEventListener("click",remove);setTimeout(remove,350);} else {add("out");setTimeout(remove,mode==="still"?200:400);}
  }
  function check(){if(done)return; if(ready&&(skipped||now()>=END)) finish(); else if(now()>=END||skipped) add("wait");}
  function skip(){if(done)return; skipped=true; if(!hit){hit=true;add("set");} add("say"); check();}
  addEventListener("pointerdown",skip,true); addEventListener("keydown",skip,true);
  setTimeout(check,END);
  function strike(){hit=true; if(window.GSSfx) GSSfx.hit(0.9); add("hit"); add("glint"); add("say");}
  if(mode==="short") add("glint");
  if(mode==="full"){
    const fs=parseFloat(getComputedStyle(mark).fontSize), D=Math.round(fs*.3), xs=innerWidth+8;
    ball.style.width=ball.style.height=D+"px";
    const lands=[.34,.58], HT=[.5,.2];   /* bounce landings (fraction of the roll) and heights (x font size) */
    let landed=0, xe=0, fy=0;
    const put=(x,y,deg,sx,sy,o)=>{ball.style.opacity=o;ball.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${deg.toFixed(0)}deg) scale(${sx.toFixed(3)},${sy.toFixed(3)})`;};
    const frame=()=>{
      if(done||skipped) return;
      const e=now();
      if(!hit){const pr=P.getBoundingClientRect(), mr=mark.getBoundingClientRect(); xe=pr.left+pr.width*.4; fy=mr.bottom-D-fs*.14;}   /* re-read: the web font may swap in */
      if(e<150){put(xs,fy,0,1,1,0);}
      else if(e<1100){
        const u=(e-150)/950, x=xs+(xe-xs)*(1.6*u-.6*u*u);   /* still moving at the P, but slowing */
        let y=0,sx=1,sy=1;
        for(let i=0;i<2;i++){const a=i?lands[0]:0,b=lands[i]; if(u<b&&u>=a){const v=(u-a)/(b-a); y=HT[i]*fs*4*v*(1-v); if(v>.88){const s=(v-.88)/.12;sx=1+.3*s;sy=1-.3*s;} else if(v<.1){const s=1-v/.1;sx=1-.12*s;sy=1+.12*s;}}}
        while(landed<2&&u>=lands[landed]){landed++; if(window.GSSfx) GSSfx.bounce(landed===1?.55:.4);}
        put(x,fy-y,(x-xs)/(D/2)*57.3,sx,sy,1);
      } else {
        if(!hit) strike();
        const k=Math.min(1,(e-1100)/400);
        put(xe+k*D*.9,fy+k*k*fs*.55,(xe-xs)/(D/2)*57.3+k*90,1,1,1-k);
        if(k>=1) return;
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
    setTimeout(()=>{if(!hit&&!done&&!skipped) strike();},1150);   /* rAF can stall in a background tab */
  }
  return {ready(){ready=true;check();}, whenGone:f=>gone?f():after.push(f), drop:remove};
})();
A.opened("lesson");
let started=false;
A.on((n,d)=>{
  if(n==="step"&&!started){started=true;A.track("lesson_start",{lesson:slug,replay:!!A.S.done[slug],daily:A.isDaily(slug)});}
  if(n==="answer") A.track("read",{lesson:slug,step:d.i+1,pick:d.X,ok:!!d.ok});
  if(n==="cue_save") A.track("cue_save",{lesson:slug,cue:d&&d.cue});   /* payoff layer (4 Oct) */
  if(n==="payoff_open") A.track("payoff_open",{lesson:slug,part:d&&d.k});
  if(n==="complete"){A.complete(slug,d.n);setTimeout(()=>wrap(d.n),0);}
});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function wrap(n){
  const w=document.getElementById("wrapup"); if(!w||w.querySelector(".appblk")) return;
  const s=A.streakNow(), nx=A.nextDaily(), asked=A.S.fb[slug];
  const flav=(A.CAT.flavours||[]).find(f=>f.lessons.includes(slug));
  const b=document.createElement("div"); b.className="appblk";
  b.innerHTML=`<div class="k">Your streak</div>
    <p class="strk"><b>${s} day${s===1?"":"s"}</b> in a row${A.isDaily(slug)&&nx?`. Tomorrow: ${esc(nx.title)}.`:"."}</p>
    ${asked?"":`<div class="gsfb"><p class="fbq">Was this useful for your tennis?</p>
      <div class="fbrow"><button data-u="yes">Yes</button><button data-u="no">Not really</button></div></div>`}
    ${flav?`<div class="gsfv"${asked?"":" hidden"}><p class="fbq">More lessons like this one?</p><div class="fbrow"><button data-fv="more">More</button><button data-fv="fewer">Fewer</button></div></div>`:""}
    ${flav&&flav.key==="opponents"?`<div class="gsop" hidden><p class="fbq">Which opponent gives you the most trouble?</p><div class="fbrow fbwrap">${["Moonballer","Pusher","Big hitter","Net rusher","Lefty","Other"].map(o=>`<button data-op="${o}">${o}</button>`).join("")}</div></div>`:""}
    <a class="next home" href="./?home=1">Back to home</a>`;
  const r=w.querySelector("#redo"); r?w.insertBefore(b,r):w.append(b);
  b.querySelectorAll("[data-fv]").forEach(bt=>bt.onclick=()=>{A.track("flavour_vote",{lesson:slug,flavour:flav.key,vote:bt.dataset.fv});
    b.querySelector(".gsfv").innerHTML=`<p class="fbthanks">Noted: ${bt.dataset.fv==="more"?"more":"fewer"} ${esc(flav.name.toLowerCase())} lessons.</p>`; const op=b.querySelector(".gsop"); if(op) op.hidden=false;});
  b.querySelectorAll("[data-op]").forEach(bt=>bt.onclick=()=>{A.track("opponent_trouble",{lesson:slug,pick:bt.dataset.op});
    b.querySelector(".gsop").innerHTML=`<p class="fbthanks">Thanks. That tells us which opponent to build next.</p>`;});
  b.querySelectorAll("[data-u]").forEach(bt=>bt.onclick=()=>{
    const u=bt.dataset.u, f=b.querySelector(".gsfb");
    A.feedback(slug,u,null); const fv=b.querySelector(".gsfv"); if(fv) fv.hidden=false;
    f.innerHTML=`<p class="fbq">${u==="yes"?"Good. What made it useful?":"Thanks. What would make it better?"} <span style="font-weight:400;color:rgba(255,255,255,.5)">(optional)</span></p>
      <textarea class="fbtx" maxlength="500" aria-label="Optional feedback" placeholder="One line is plenty; no personal details"></textarea><div class="fbrow"><button id="fbsend">Send</button></div>`;
    f.querySelector("#fbsend").onclick=()=>{const t=f.querySelector("textarea").value.trim(); if(t) A.track("feedback_comment",{lesson:slug,useful:u,comment:t.slice(0,500)});
      f.innerHTML=`<p class="fbthanks">Thanks, that helps.</p>`;};
  });
}
function afterEngine(){
  /* close returns to the Home you came from (so the browser's back doesn't reopen the lesson) */
  const cl=document.getElementById("close"), fromApp=(()=>{try{return document.referrer&&new URL(document.referrer).origin===location.origin;}catch(e){return false;}})();
  if(cl&&(fromApp||QS.has("auto"))&&history.length>1) cl.addEventListener("click",e=>{e.preventDefault();history.back();const t=setTimeout(()=>{location.href="./?home=1";},700);addEventListener("pagehide",()=>clearTimeout(t),{once:true});});
  const st=document.getElementById("stage");
  if(st&&window.GSSfx){const b=document.createElement("button");b.type="button";b.className="gs-snd";b.setAttribute("data-gs-sound","");st.appendChild(b);GSSfx.wire(st);}
  if(QS.has("auto")) A.track("auto_start",{lesson:slug,intro:QS.has("intro")});
  if(QS.has("intro")&&st){try{localStorage.setItem("gs_intro_seen","1");}catch(e){}
    (W?W.whenGone:f=>f())(()=>{   /* the first-visit caption comes after the welcome, never under it */
    const c=document.createElement("div");c.className="gs-intro";c.innerHTML=`<b>One three-minute tennis decision a day.</b><span>Here's today's. Watch the ball.</span>`;
    st.appendChild(c);const go=()=>{c.classList.add("out");setTimeout(()=>c.remove(),500);};setTimeout(go,4200);c.addEventListener("click",go);});}
}
function fail(){if(W)W.drop();ld.className="err";ld.innerHTML=`Couldn't load this lesson. Check your connection and <a href="">try again</a>, or go <a href="./?home=1">home</a>.`;}
const get=u=>fetch(u).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();});
Promise.all([get(`lessons/${slug}.json?v=${V}`)].concat(L.clips.map(c=>get(`clips/${c}.json?v=${V}`)))).then(([les,...cl])=>{
  const clips={}; L.clips.forEach((c,i)=>clips[c]=cl[i]);
  window.DATA={clips,scenes:les.scenes}; window.LESSON=les.lesson;
  const s=document.createElement("script"); s.src=`engine/engine.js?v=${V}`;
  s.onload=()=>{if(W){ld.remove();W.ready();}else{ld.classList.add("out");setTimeout(()=>ld.remove(),420);}afterEngine();}; s.onerror=fail; document.body.appendChild(s);
}).catch(fail);
})();
</script>
