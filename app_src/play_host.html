<script>
(function(){
  /* full: first auto-start of the calendar day (gs_welcome_day); short: later the same day; still: reduced motion */
  var w=document.getElementById("gsw"); if(!w||!new URLSearchParams(location.search).has("auto")) return;
  var d=new Date(), p=function(n){return String(n).padStart(2,"0");}, day=d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()), m="full";
  try{ if(matchMedia("(prefers-reduced-motion: reduce)").matches) m="still";
       else if(localStorage.getItem("gs_welcome_day")===day) m="short"; else localStorage.setItem("gs_welcome_day",day); }catch(e){ m="short"; }

<script>
(function(){
const A=GSApp, V="__VER__", slug=new URLSearchParams(location.search).get("l"), L=A.bySlug(slug), ld=document.getElementById("loading");
if(!L){location.replace("./?home=1");return;}
GSSfx.configureVoice(slug);
window.GS_HOME_URL="./?home=1";   /* Home never auto-starts a lesson when you come back from one */
const QS=new URLSearchParams(location.search);
const practicePath=A.practicePath(QS.get('path'));
const resetRoutine=['mistake','pressure','partner'].includes(QS.get('routine'))?QS.get('routine'):null;
const resetReturn='./?review=1&z=reset'+(resetRoutine?'&r='+resetRoutine:'');
const practiceContext=practicePath?.slugs.includes(slug)?{href:`./?review=1&z=${practicePath.zone}#path-${practicePath.id}`,label:'Continue my Sharpen path →'}
  :QS.get('from')==='my-game'?{href:'./?review=1&z=my-game',label:'Back to My Game →'}
  :QS.get('from')==='reset'?{href:resetReturn,label:'Back to Reset →'}
  :L.doubles?{href:'./?review=1&z=doubles',label:'Back to doubles →'}:null;
const practiceReturn=practiceContext?.href||null;
if(practiceReturn)window.GS_HOME_URL=practiceReturn; // The first-step Back button returns to the chosen practice context.
window.GS_BLIND_CHALLENGE=!!(L.livePoint&&QS.get('challenge')==='point');
if(QS.get('challenge')==='daily'&&A.isDaily(slug))A.track('daily_challenge_open',{lesson:slug,featured_today:A.featuredDaily()?.lesson.slug===slug,previously_played:!!A.S.done[slug]});
if(QS.get('via')==='share')A.track('shared_activity_open',{lesson:slug,previously_played:!!A.S.done[slug]});
if(window.GS_BLIND_CHALLENGE)A.track('challenge_open',{lesson:slug,previously_played:!!A.S.done[slug]});
// Bookmarked automatic entries advance too; explicit lesson/replay links stay exact.
if(QS.has('auto')&&(A.S.seen?.[slug]||A.S.done[slug])){
  const fresh=A.nextDaily();
  location.replace(fresh&&!A.S.seen?.[fresh.slug]?`play.html?l=${fresh.slug}&auto=1`:'./?home=1');return;
}
/* An auto-started lesson replaced the bare Home visit, so give back/close a Home entry to return to:
   this page's entry becomes ./?home=1 and the lesson is pushed on top; going back to it loads Home. */
if(QS.has("auto")&&!(history.state&&history.state.gsLesson)){const here=location.href;history.replaceState({gsHome:1},"","./?home=1");history.pushState({gsLesson:1},"",here);}
addEventListener("popstate",e=>{if(e.state&&e.state.gsHome)location.replace("./?home=1");});
window.GS_DISPLAY_TITLE=A.invitation(L).title;
document.title=(window.GS_BLIND_CHALLENGE?"Read this point":window.GS_DISPLAY_TITLE)+" · GameSharp";
/* Welcome timeline (full ~2.0 s): 0.15-1.10 s the ball rolls in from the right (P is the first letter it meets, as in V5) with two small bounces and slows into the P;
   1.10 s impact (P snaps straight, wordmark sharpens, gold glint, ball drops away); 1.10-1.60 s the promise fades up;
   1.60-2.00 s dissolve to the lesson, which has been loading underneath since 0 s. Short: glint, dissolve at 0.2 s.
   Not ready yet: hold the final frame with a soft pulse. A tap or key skips. */
const W=(()=>{
  const w=document.getElementById("gsw"); if(!w||w.hidden) return null;
  const mode=w.className, t0=+w.dataset.t0||performance.now(), mark=w.querySelector(".gsw-mark"), P=mark.querySelector("em"), ball=w.querySelector(".gsw-ball");
  const END={full:1600,short:200}[mode]||0, now=()=>performance.now()-t0;
  let ready=false, skipped=false, hit=false, done=false, gone=false, after=[];
  const add=c=>w.classList.add(c);
  function remove(){if(gone)return;gone=true;w.remove();after.splice(0).forEach(f=>f());}
  function finish(){
    if(done) return; done=true; removeEventListener("pointerdown",skip,true); removeEventListener("keydown",skip,true);
    try{A.track("welcome_seen",{full:mode==="full",skipped,ms:Math.round(now())});}catch(e){}
    if(!hit) add("set");
    /* a skip vanishes at once but keeps catching that tap's click for a moment, so it can't land on the lesson */
    if(skipped){add("gone");w.addEventListener("click",remove);setTimeout(remove,350);} else {add("out");setTimeout(remove,mode==="still"?200:400);}
  }
  function check(){if(done)return; if(ready&&(skipped||now()>=END)) finish(); else if(now()>=END||skipped) add("wait");}
  function skip(){if(done)return; skipped=true; if(!hit){hit=true;add("set");} add("say"); check();}
  addEventListener("pointerdown",skip,true); addEventListener("keydown",skip,true);
  setTimeout(check,END);
  function strike(){hit=true; add("hit"); add("glint"); add("say");}
  if(mode==="short") add("glint");
  if(mode==="full"){
    const fs=parseFloat(getComputedStyle(mark).fontSize), D=Math.round(fs*.3), xs=innerWidth+8;
    ball.style.width=ball.style.height=D+"px";
    const lands=[.34,.58], HT=[.5,.2];   /* bounce landings (fraction of the roll) and heights (x font size) */
    let landed=0, xe=0, fy=0;
    const put=(x,y,deg,sx,sy,o)=>{ball.style.opacity=o;ball.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${deg.toFixed(0)}deg) scale(${sx.toFixed(3)},${sy.toFixed(3)})`;};
    const frame=()=>{
      if(done||skipped) return;
      const e=now();
      if(!hit){const pr=P.getBoundingClientRect(), mr=mark.getBoundingClientRect(); xe=pr.left+pr.width*.4; fy=mr.bottom-D-fs*.14;}   /* re-read: the web font may swap in */
      if(e<150){put(xs,fy,0,1,1,0);}
      else if(e<1100){
        const u=(e-150)/950, x=xs+(xe-xs)*(1.6*u-.6*u*u);   /* still moving at the P, but slowing */
        let y=0,sx=1,sy=1;
        for(let i=0;i<2;i++){const a=i?lands[0]:0,b=lands[i]; if(u<b&&u>=a){const v=(u-a)/(b-a); y=HT[i]*fs*4*v*(1-v); if(v>.88){const s=(v-.88)/.12;sx=1+.3*s;sy=1-.3*s;} else if(v<.1){const s=1-v/.1;sx=1-.12*s;sy=1+.12*s;}}}
        while(landed<2&&u>=lands[landed]){landed++;}
        put(x,fy-y,(x-xs)/(D/2)*57.3,sx,sy,1);
      } else {
        if(!hit) strike();
        const k=Math.min(1,(e-1100)/400);
        put(xe+k*D*.9,fy+k*k*fs*.55,(xe-xs)/(D/2)*57.3+k*90,1,1,1-k);
        if(k>=1) return;
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
    setTimeout(()=>{if(!hit&&!done&&!skipped) strike();},1150);   /* rAF can stall in a background tab */
  }
  return {ready(){ready=true;check();}, whenGone:f=>gone?f():after.push(f), drop:remove};
})();
A.opened("lesson");
let started=false, dailyAttempt=null;
const useDailyDraft=A.isDaily(slug)&&!QS.has('via')&&!QS.has('auto')&&!practiceContext&&
  (QS.get('challenge')==='daily'||A.dailyDraft(slug));
if(useDailyDraft){
  // Consume the explicit restart once so that refreshing this URL can resume.
  const restart=QS.get('restart')==='1';
  if(restart){const url=new URL(location.href);url.searchParams.delete('restart');history.replaceState(history.state,'',url);}
  window.GSDailyAttempt={
    open(steps,again=false){
      dailyAttempt=A.openDaily(slug,restart||again);
      if(!dailyAttempt.picks.every((x,i)=>steps[i]?.opts['ABCD'.indexOf(x)]))
        dailyAttempt=A.openDaily(slug,true);
      return dailyAttempt.picks.slice();
    },
    pick(i,x){return A.recordDailyPick(slug,dailyAttempt.id,i,x);},
    pending(){const i=dailyAttempt.pendingReply;return Number.isInteger(i)&&i>=0&&i===dailyAttempt.picks.length-1?i:null;},
    shown(i){A.dailyReplyShown(slug,dailyAttempt.id,i);}

}

A.on((n,d)=>{
  if(n==='step'&&d.fresh){A.beginLiveAttempt(slug);GSSfx.configureVoice(slug);}

  if(n==='comparison_seen')A.track('live_point_comparison',{lesson:slug,...d});
  if(n==="cue_save") A.track("cue_save",{lesson:slug,cue:d&&d.cue});   /* payoff layer (4 Oct) */
  if(n==="payoff_open") A.track("payoff_open",{lesson:slug,part:d&&d.k});
  if(n==="complete"){A.complete(slug,d.n,d.total,dailyAttempt?.id);setTimeout(()=>wrap(d.n),0);}
});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function wrap(n){
  const w=document.getElementById("wrapup"); if(!w||w.querySelector(".appblk")) return;
  const takeaway=window.GSTakeaways?.render(slug);
  if(takeaway)w.firstElementChild?.querySelector('.mem')?.insertAdjacentHTML('afterend',takeaway);
  const s=A.streakNow(), nx=A.nextDaily(), nextPoint=L.livePoint&&A.nextLivePoint(), asked=A.S.fb[slug];
  const isChallenge=A.isDaily(slug)||A.CAT.predict.some(l=>l.slug===slug),featured=A.featuredDaily(),related=isChallenge&&A.relatedPoint(slug);
  const dailyEnd=isChallenge?`<div class="gs-continue daily-completion"><p class="daily-complete-message">${featured?.lesson.slug===slug?"Today's challenge complete.":'Challenge complete.'} One useful read is enough.</p><a class="next" id="dailyDone" href="./?home=1">${featured?.lesson.slug===slug?'Done for today':'Back to home'} →</a>${related?`<div class="daily-related"><div class="k">Optional · go a little further</div><h2>Now try it in a point.</h2><p>${esc(A.invitation(related.lesson).setup)}</p><a class="alt" id="relatedLivePoint" href="play.html?l=${related.lesson.slug}&from=daily&lesson=${encodeURIComponent(slug)}">${esc(A.invitation(related.lesson).title)} →</a></div>`:''}${nx?`<a class="alt" id="nextDaily" href="play.html?l=${nx.slug}">Continue your personal practice →</a>`:'<a class="alt" href="./?all=1">Explore challenges →</a>'}</div>`:'';
  /* Saturday Point (6 Oct): lessons and the weekend point point at each other */
  const feeds=(A.CAT.play||[]).filter(p=>p.uses&&p.uses.includes(slug));
  const used=(L.uses||[]).map(u=>A.bySlug(u)).filter(Boolean);
  const weekBlk=used.length?`<div class="k">Built from your lessons</div><div class="gs-uses">${used.map(u=>{const d=A.S.done[u.slug];return `<a href="play.html?l=${u.slug}" class="${d?"done":"todo"}"><span>${d?"✓":"○"}</span>${esc(A.invitation(u).title)}${d?"":` <i>Not played yet</i>`}</a>`;}).join("")}</div>`
    :feeds.length?`<p class="strk gs-feeds">This lesson shows up in <a href="play.html?l=${feeds[0].slug}">${esc(feeds[0].title)}</a>.</p>`:"";
  const flav=(A.CAT.flavours||[]).find(f=>f.lessons.includes(slug));
  const b=document.createElement("details"); b.className="appblk completion-extras";
  const returnPoint=L.followup&&A.bySlug(L.followup);
  const transfer=A.transferEvidence(slug),due=returnPoint&&A.S.done[slug]?.first<A.today();
  const returnBlk=returnPoint&&!A.S.done[returnPoint.slug]?`<div class="blk" id="returnRead"><div class="k">${due?'Your next read':'Tomorrow’s read'}</div>${due?`<p class="strk">${esc(A.invitation(returnPoint).setup)}</p>`: ''}<p class="strk">${due?'Ready in My Game now.':A.progressSaved()?'Find it in My Game from tomorrow in this browser.':'Progress could not be saved; use the link below to return to this point.'}</p><a class="alt" href="play.html?l=${returnPoint.slug}">${due?'Read the other point':'Try now as practice'} →</a><a class="alt" href="./?review=1&z=my-game">My practice &amp; next read →</a></div>`:transfer?`<div class="blk" id="returnRead"><div class="k">${transfer.kind==='first_later_day'?'Your return read':'Practice variation'}</div><p class="strk">${esc(transfer.text)}</p><p class="strk">${transfer.kind==='first_later_day'?'Two decisions in a changed situation. Take the cue onto court.':'A repeat or an early look is practice, not a fresh next-day check.'}</p></div>`:'';
  b.innerHTML=`<summary>Progress &amp; more</summary>${returnBlk}${weekBlk}<div class="k">Your streak</div>
    <p class="strk"><b>${s} day${s===1?"":"s"}</b> in a row. Come back tomorrow for another read.</p>
    ${isChallenge?dailyEnd:nx||nextPoint?`<div class="gs-continue"><div class="k">Keep playing · Beta</div><p class="strk">Next: ${esc(A.invitation(nextPoint||nx).title)}</p>${nextPoint?`<a class="next" id="nextLivePoint" href="play.html?l=${nextPoint.slug}">Read the next Live Point →</a>`:""}${nx?`<a class="${nextPoint?'alt':'next'}" id="nextDaily" href="play.html?l=${nx.slug}">${nextPoint?'Try a daily challenge':'Play next challenge'} →</a>`:""}</div>`:`<p class="strk">You've played every daily challenge. Revisit one in Explore or practise a saved cue.</p><a class="next" href="./?all=1">Explore challenges →</a>`}
    ${asked?"":`<div class="gsfb"><p class="fbq">Was this useful for your tennis?</p>
      <div class="fbrow"><button data-u="yes">Yes</button><button data-u="no">Not really</button></div></div>`}
    ${flav?`<div class="gsfv"${asked?"":" hidden"}><p class="fbq">More lessons like this one?</p><div class="fbrow"><button data-fv="more">More</button><button data-fv="fewer">Fewer</button></div></div>`:""}
    ${flav&&flav.key==="opponents"?`<div class="gsop" hidden><p class="fbq">Which opponent gives you the most trouble?</p><div class="fbrow fbwrap">${["Moonballer","Pusher","Big hitter","Net rusher","Lefty","Other"].map(o=>`<button data-op="${o}">${o}</button>`).join("")}</div></div>`:""}
    <a class="next home" href="./?home=1">Back to home</a>`;
  w.append(b);
  if(practiceReturn){const back=document.createElement('a');back.className='next';back.id='practiceReturn';back.href=practiceReturn;back.textContent=practiceContext.label;const anchor=w.querySelector('#liveEvidence')||w.firstElementChild;anchor.after(back);}
  const more=b.querySelector('#nextDaily');if(more)more.onclick=()=>A.track('asked_more',{next:nx.slug,from:slug});
  const continuation=b.querySelector('.gs-continue')||b.querySelector('a.next:not(.home)');
  // Give the professional connection its place in the challenge payoff, before
  // the optional continuation. Authored story/source text stays unchanged.
  const pro=isChallenge&&w.querySelector('[data-k=pro]');
  if(pro&&!practiceReturn){
    const previousPanel=pro.closest('.completion-more');
    pro.open=true;w.firstElementChild.after(pro);
    // Anticipation endings can contain only the pro story. Moving it out must
    // not leave an empty "Professional context" disclosure behind.
    if(previousPanel&&![...previousPanel.children].some(el=>el.tagName!=='SUMMARY'&&el.textContent.trim()))previousPanel.remove();
  }
  if(continuation&&!practiceReturn)(pro||w.querySelector('#liveEvidence')||w.firstElementChild).after(continuation);
  const saveActions=w.querySelector('.cue-actions');
  const dailyDone=w.querySelector('#dailyDone');
  if(saveActions&&dailyDone&&!practiceReturn){
    const buttons=document.createElement('div');buttons.className='daily-finish-actions';
    saveActions.prepend(buttons);buttons.append(dailyDone,w.querySelector('#saveCue'));
  }
  w.querySelector('#relatedLivePoint')?.addEventListener('click',()=>A.track('daily_to_live',{from:slug,to:related.lesson.slug}));
  wireChallenge(w);
  const pendingText='Sending…';
  const deliveryError=()=>location.hostname==='www.gamesharptennis.com'||location.hostname==='gamesharptennis.com'?'Could not send. Check your connection and try again.':'Preview: feedback is not sent. Use the live app to send it.';
  b.querySelectorAll("[data-fv]").forEach(bt=>bt.onclick=async()=>{
    const group=b.querySelector('.gsfv');group.querySelectorAll('button').forEach(x=>x.disabled=true);
    const sent=await A.track('flavour_vote',{lesson:slug,flavour:flav.key,vote:bt.dataset.fv});
    if(sent){group.innerHTML=`<p class="fbthanks">Received: ${bt.dataset.fv==='more'?'more':'fewer'} ${esc(flav.name.toLowerCase())} lessons.</p>`;const op=b.querySelector('.gsop');if(op)op.hidden=false;}
    else{group.querySelectorAll('button').forEach(x=>x.disabled=false);group.querySelector('.fbq').textContent=deliveryError();}
  });
  b.querySelectorAll('[data-op]').forEach(bt=>bt.onclick=async()=>{
    const group=b.querySelector('.gsop');group.querySelectorAll('button').forEach(x=>x.disabled=true);
    const sent=await A.track('opponent_trouble',{lesson:slug,pick:bt.dataset.op});
    if(sent)group.innerHTML='<p class="fbthanks">Received. Thanks for telling us.</p>';
    else{group.querySelectorAll('button').forEach(x=>x.disabled=false);group.querySelector('.fbq').textContent=deliveryError();}
  });
  const feedbackBox=b.querySelector('.gsfb');
  feedbackBox?.querySelectorAll('[data-u]').forEach(bt=>bt.onclick=()=>{
    const u=bt.dataset.u,f=feedbackBox;
    f.innerHTML=`<p class="fbq">${u==='yes'?'What made it useful?':'What would make it better?'} <span>(optional)</span></p><textarea class="fbtx" maxlength="500" aria-label="Optional feedback" placeholder="One line is plenty; no personal details"></textarea><div class="fbrow"><button id="fbsend">Send feedback</button></div><p id="fbstatus" role="status"></p>`;
    f.querySelector('#fbsend').onclick=async()=>{
      const button=f.querySelector('#fbsend'),status=f.querySelector('#fbstatus');button.disabled=true;status.textContent=pendingText;
      const sent=await A.feedback(slug,u,f.querySelector('textarea').value.trim());
      if(sent){f.innerHTML='<p class="fbthanks" role="status">Feedback received. Thank you.</p>';const fv=b.querySelector('.gsfv');if(fv)fv.hidden=false;}
      else{button.disabled=false;status.textContent=deliveryError();}
    };
  });
  // Keep the optional beta question and paired read within the main journey.
  if(feedbackBox)b.before(feedbackBox);
  const paired=b.querySelector('#returnRead');if(paired)b.before(paired);
  const storage=document.createElement('p');storage.className='strk';storage.id='progressStorage';storage.setAttribute('role','status');
  storage.textContent=A.progressSaved()?'Progress saved in this browser.':'Progress could not be saved. It is only kept on this page; leaving or reloading can lose it.';
  w.firstElementChild.append(storage);
  window.GSTakeaways?.mount(w);

}
function localStorageIntroSeen(){try{return localStorage.getItem('gs_intro_seen')==='1';}catch{return false;}}
function afterEngine(){
  wireQuickShare();
  const coach=document.createElement('details');coach.className='lesson-coach';
  coach.innerHTML='<summary>Coach: <span data-coach-name></span></summary><div class="lesson-coach-panel"><div data-gs-coach-control></div><p>Your choice is used for spoken cues and Reset. Sound controls stay separate.</p></div>';
  document.querySelector('.head').insertBefore(coach,document.getElementById('close'));
  coach.addEventListener('keydown',e=>{if(e.key==='Escape'){coach.open=false;coach.querySelector('summary').focus();}});
  const paintCoach=()=>{coach.querySelector('[data-coach-name]').textContent=GSCoach.name();};
  GSCoach.wire(coach);paintCoach();GSCoach.onChange(paintCoach);

  /* close returns to the Home you came from (so the browser's back doesn't reopen the lesson) */
  const cl=document.getElementById('close');
  if(cl){
    const destination=practiceReturn||(()=>{try{const u=new URL(document.referrer);if(u.origin===location.origin&&(u.pathname==='/'||u.pathname==='/index.html')&&(u.searchParams.has('all')||u.searchParams.has('review')))return u.pathname+u.search+u.hash;}catch(e){}return './?home=1';})();
    cl.href=destination;
  }
  const st=document.getElementById("stage");
  if(st&&window.GSSfx){const b=document.createElement("button");b.type="button";b.className="gs-snd";b.setAttribute("data-gs-sound","");st.appendChild(b);GSSfx.wire(st);}
  if(QS.has("auto")) A.track("auto_start",{lesson:slug,intro:QS.has("intro")});
  if(QS.has("intro")&&st&&!localStorageIntroSeen()){try{localStorage.setItem("gs_intro_seen","1");}catch(e){}
    (W?W.whenGone:f=>f())(()=>{   /* the first-visit caption comes after the welcome, never under it */
    const c=document.createElement("div");c.className="gs-intro";c.innerHTML=`<b>One three-minute tennis decision a day.</b><span>Here's today's. Watch the ball.</span>`;
    st.appendChild(c);const go=()=>{c.classList.add("out");setTimeout(()=>c.remove(),500);};setTimeout(go,4200);c.addEventListener("click",go);});}
}
function wireQuickShare(){
  const button=document.createElement('button');button.id='quickShare';button.className='tbtn';button.type='button';button.title='Share this activity';button.setAttribute('aria-label','Share this activity');
  button.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 16V3m-4 4 4-4 4 4M5 11v10h14V11"/></svg>';
  document.getElementById('tools').append(button);
  button.onclick=()=>{A.track('activity_share_intent',{lesson:slug,where:'playing'});GSShare.open(slug,{onShared:method=>A.track('activity_shared',{lesson:slug,where:'playing',method})});};
}
function wireChallenge(w){
  const daily=A.isDaily(slug),link=A.shareUrl(slug),box=document.createElement('div');box.className='blk';box.id='sharePoint';
  box.innerHTML=`<div class="k">Let someone else make the call</div><p>Your friend plays the same point and makes their own decisions.</p><button class="alt" id="sharePointButton">Challenge a tennis friend</button><p id="shareStatus" role="status"></p>`;
  // Keep the cue, professional story and continuation together before sharing.
  (w.querySelector(':scope > .gs-continue, :scope > #practiceReturn')||w.querySelector(':scope > [data-k=pro]')||w.querySelector('#liveEvidence')||w.firstElementChild).after(box);
  if(daily){box.querySelector('.k').textContent='Compare decisions with a friend';box.querySelector('p').textContent='Your friend gets the same challenge and makes their own choices.';box.querySelector('#sharePointButton').textContent='Send this challenge to a friend';}
  const status=box.querySelector('#shareStatus');
  box.querySelector('#sharePointButton').onclick=()=>{
    A.track(daily?'daily_share_intent':'challenge_share_intent',{lesson:slug});
    GSShare.open(slug,{onStatus:text=>status.textContent=text,onShared:method=>A.track(daily?'daily_shared':'challenge_shared',{lesson:slug,method})});
  };
  if(L.doubles){
    box.querySelector('.k').textContent='Play this with your doubles partner';box.querySelector('p').textContent='Send the point first. Let your partner make their own calls, then discuss your plan.';box.querySelector('#sharePointButton').textContent='Send the point to my partner';
    const plan=document.createElement('details');plan.className='pay';plan.id='pairPlan';plan.innerHTML=`<summary>Then agree a plan for your next match</summary><p>This is a suggested starting plan. Edit it together; GameSharp does not know whether your partner agrees.</p><label for="pairPlanText">My proposed plan</label><textarea id="pairPlanText" maxlength="420" rows="4" style="display:block;width:100%;box-sizing:border-box;margin:12px 0;padding:14px;background:#14221b;color:#f0ece3;border:1px solid #68795c;border-radius:10px;font:inherit">${esc(L.pairPlan)}</textarea><button class="alt" id="sharePairPlan">Share proposed plan</button><button class="alt" id="copyPairPlan">Copy proposed plan</button><p id="pairPlanStatus" role="status"></p><a class="alt" href="./?review=1&z=reset&r=partner">When the partnership feels tense · Reset →</a>`;box.append(plan);
    const msg=()=>`GameSharp Tennis · Proposed plan for our next doubles match\n${plan.querySelector('textarea').value.trim()}\nDiscuss after playing: ${link}`,out=plan.querySelector('#pairPlanStatus');
    const copy=async()=>{if(!plan.querySelector('textarea').value.trim()){out.textContent='Add a plan before sharing.';return;}try{await navigator.clipboard.writeText(msg());out.textContent='Proposed plan copied. Paste it into your conversation when ready.';}catch{plan.querySelector('textarea').select();out.textContent='Select and copy your plan above.';}};
    plan.querySelector('#copyPairPlan').onclick=copy;
    plan.querySelector('#sharePairPlan').onclick=()=>{if(!plan.querySelector('textarea').value.trim()){out.textContent='Add a plan before sharing.';return;}GSShare.open(slug,{plan:plan.querySelector('textarea').value,onStatus:text=>out.textContent=text});};
  }
}
function fail(){if(W)W.drop();ld.className="err";ld.innerHTML=`Couldn't load this lesson. Check your connection and <a href="">try again</a>, or go <a href="./?home=1">home</a>.`;}
const get=u=>fetch(u).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();});
Promise.all([get(`lessons/${slug}.json?v=${V}`)].concat(L.clips.map(c=>get(`clips/${c}.json?v=${V}`)))).then(([les,...cl])=>{
  const clips={}; L.clips.forEach((c,i)=>clips[c]=cl[i]);
  window.DATA={clips,scenes:les.scenes}; window.LESSON=les.lesson;
  const s=document.createElement("script"); s.src=`engine/engine.js?v=${V}`;
  s.onload=()=>{if(W){ld.remove();W.ready();}else{ld.classList.add("out");setTimeout(()=>ld.remove(),420);}afterEngine();}; s.onerror=fail; document.body.appendChild(s);
}).catch(fail);
})();
</script>
