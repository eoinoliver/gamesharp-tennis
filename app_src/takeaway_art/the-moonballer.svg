<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 164">
  <defs>
    <g id="ss-head">
      <path d="M-3 3l-1 5 6 1 1 -7Z" fill="#b5bea6" />
      <path d="M-5 -6Q0 -10 5 -6Q8 -3 5 2L2 6H-2l-2 -3 -3 -1 2 -3Z" fill="#e7e6cf" />
      <path d="M-6 -5q3 -6 10 -3l3 5 -5 -1 -2 -2 -9 2Z" fill="#9ab6a2" />
    </g>
    <g id="ts-athlete">
      <path d="M-1 -30l10 10 6 18" fill="none" stroke="#88a396" stroke-width="5.5" stroke-linecap="round" />
      <path d="M-1 -28l-8 10 -6 16" fill="none" stroke="#e4dcc0" stroke-width="5.5" stroke-linecap="round" />
      <path d="M-18 -3h6l3 3 -13 1zM10 -3h7l4 3 -12 1z" fill="#f6ebca" />
      <path d="M-5 -51q4 -4 10 0l2 20 -11 1 -3 -5Z" fill="#bdd0a7" />
      <path d="M-6 -34l13 -2 2 8 -6 4 -10 -4Z" fill="#6c9684" />
      <use href="#ss-head" transform="translate(0,-58)" />
    </g>
    <g id="ts-ball">
      <circle r="5.6" fill="#fadd77" stroke="#263c31" stroke-width="1.5" />
      <path d="M-3.8 -3.4Q1 -2 2 4.2" fill="none" stroke="#9b803e" stroke-width=".9" />
    </g>
    <g id="ts-court">
      <rect x="2" y="4" width="156" height="156" rx="4" fill="#173a32" />
      <path d="M2 115L158 96V160H2Z" fill="#285547" />
      <path d="M4 137H156" stroke="#a8b7a1" stroke-width="1.8" />
    </g>
    <pattern id="ts-weave" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 5V0H5" fill="none" stroke="#b3c8b6" stroke-width="1.2" />
    </pattern>
    <g id="ts-net">
      <path d="M0 0L8 -4v41l-8 4Z" fill="url(#ts-weave)" opacity=".7" />
      <path d="M0 41V0l9 -4" fill="none" stroke="#e7ebcd" stroke-width="2.4" stroke-linecap="round" />
    </g>
    <g id="ts-rac">
      <ellipse cy="-13" rx="9" ry="13" fill="url(#ts-weave)" stroke="#e9ecd4" stroke-width="2.1" />
      <path d="M-5.5 -2L0 8 5.5 -2M0 8v9" fill="none" stroke="#ddd5af" stroke-width="2.1" />
      <path d="M0 13v9" stroke="#c28d70" stroke-width="3.8" stroke-linecap="round" />
    </g>
    <g id="ts-boot">
      <path d="M-11 -14l10 1 2 7 8 4 6 2 1 4h-30l-1 -5Z" fill="#e9ebd2" stroke="#203b31" stroke-width="1.6" />
      <path d="M-12 1q12 3 27 1M-1 -7l-3 3m7 -1l-3 3" fill="none" stroke="#6b8c78" stroke-width="1.5" />
      <path d="M-10 -14l9 1" stroke="#93b29c" stroke-width="2" />
    </g>
  </defs>
  <svg viewBox="0 0 160 164" role="img" aria-label="The high incoming ball bounces deep. The receiver steps in to take it on the rise, before its peak." x="0" width="160" height="164" class="tk-drawing tk-redraw">
    <use href="#ts-court" />
    <use href="#ts-net" transform="translate(22 97) scale(.76 1)" />
    <path d="M5 20Q57 11 95 137Q119 50 151 32" fill="none" stroke="#849e8e" stroke-width="2" stroke-dasharray="4 3" />
    <g data-recall-cue="">
      <path d="M5 20Q57 11 95 137Q102 113 110 95" fill="none" stroke="#f3d477" stroke-width="2.8" />
      <g transform="translate(136 134) scale(.74)">
        <use href="#ts-athlete" />
        <path d="M-2 -49l-9 8 -8 -3" fill="none" stroke="#e8dfbf" stroke-width="4" />
        <use href="#ts-rac" transform="translate(-25 -45) rotate(-46) scale(.73)" />
      </g>
      <use href="#ts-ball" transform="translate(110 95)" />
    </g>
  </svg>
  <svg viewBox="0 0 160 164" role="img" aria-label="Now the reply bounces near the service line. The player comes forward to the short ball and follows the approach." x="160" width="160" height="164" class="tk-drawing tk-redraw">
    <use href="#ts-court" />
    <use href="#ts-net" transform="translate(22 97) scale(.76 1)" />
    <path d="M4 82Q34 59 63 136Q71 110 78 102" fill="none" stroke="#f3d477" stroke-width="2.8" />
    <g data-recall-cue="">
      <g transform="translate(99 134) scale(.74)">
        <use href="#ts-athlete" />
        <path d="M-3 -47l-9 12 -7 0" fill="none" stroke="#e8dfbf" stroke-width="4" />
        <use href="#ts-rac" transform="translate(-23 -34) rotate(-50) scale(.74)" />
      </g>
      <use href="#ts-ball" transform="translate(78 102)" />
      <path d="M142 148H47l9 -5m-9 5 9 5" fill="none" stroke="#c4dbc6" stroke-width="2.2" />
      <use href="#ts-boot" transform="translate(140 132) scale(-.55 .55)" opacity=".38" />
    </g>
  </svg>
</svg>
