      <path d="M5 13l2 -1 M17 6h2 M25 19l1 -1" stroke="#efb193" stroke-width=".95" opacity=".65" />
    </pattern>
    <g id="gs-corner">
      <rect x="3" y="9" width="154" height="146" rx="3" fill="#a95f45" />
      <rect x="3" y="9" width="154" height="146" rx="3" fill="url(#gs-grit)" />
      <path d="M3 46H112V155" fill="none" stroke="#f3e5c9" stroke-width="4" />
      <path d="M7 145q29 -18 54 -17 M15 146q25 -13 40 -13 M20 152q25 -14 44 -15" fill="none" stroke="#c58060" stroke-width="1.4" opacity=".8" />
