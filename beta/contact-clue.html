<!doctype html>
<html lang="en">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b160e">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contact Clue in 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&display=swap">
<style>
/* Layout and hierarchy copied from the live app's Daily lesson (gold-daily-prototypes.css,
   "approved coaching hierarchy"); the 3D stage replaces the court map. */
:root{
  color-scheme:dark;
  --gold:#c8a84b; --lime:#d3e267; --green:#59bd70; --red:#e07070;
  --ink:#f0ece3; --line:rgba(255,255,255,.12);
  --court:#132914; --court-in:#1e5a22; --court-line:rgba(233,240,225,.78);
  --ball:#d2e83a; --accent:#c8a84b; --warn:#e05252;
}
*{box-sizing:border-box}
html{background:#090a09}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
  background:radial-gradient(90% 52% at 50% 7%,rgba(39,89,48,.34),transparent 74%),linear-gradient(180deg,#0b160e 0%,#0a0f0b 58%,#090a09 100%) no-repeat}
button{font:inherit}
.shell{width:min(100%,680px);margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(26px + env(safe-area-inset-bottom))}
@media(min-width:700px){.shell{padding-left:24px;padding-right:24px}}

/* header: back · brand · close */
.head{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;min-height:48px;margin-bottom:8px}
.brand{text-align:center;font-family:"Bebas Neue","Arial Narrow",sans-serif;font-size:19px;letter-spacing:2.7px;white-space:nowrap}
.brand span{color:var(--gold)}
.ico{width:44px;height:44px;border:1px solid rgba(255,255,255,.13);border-radius:50%;background:rgba(255,255,255,.035);
  color:var(--ink);display:grid;place-items:center;cursor:pointer;text-decoration:none;font-size:18px;line-height:1}
.ico:active{transform:scale(.96)}
:focus-visible{outline:3px solid var(--lime);outline-offset:3px}

/* lesson name · count */
.meta{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;margin:1px 0 10px}
.meta .name{font-size:13px;line-height:1.3;color:rgba(255,255,255,.7);font-weight:600}
.meta .count{font-size:12px;color:var(--gold);white-space:nowrap}
.setup{margin:0 0 12px;font-size:16px;line-height:1.4;color:rgba(255,255,255,.9);text-wrap:pretty;min-height:2.8em}

/* the visual card: cue rail + tools, the 3D stage, the ink line */
.visual{position:relative;overflow:hidden;border:1px solid rgba(111,205,130,.21);border-radius:17px;
  background:radial-gradient(95% 82% at 50% 43%,#174b22 0%,#0b2511 66%,#071309 100%);
  box-shadow:inset 0 0 42px rgba(0,0,0,.22),0 13px 30px rgba(0,0,0,.22)}
.tools{display:grid;grid-template-columns:minmax(0,1fr) 44px 44px 44px 44px;align-items:center;min-height:44px;padding-left:10px;
  border-bottom:1px solid rgba(255,255,255,.07);background:rgba(2,10,4,.22)}
.rail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;gap:5px;min-width:0;
  color:rgba(255,255,255,.43);font-size:8.5px;font-weight:800;letter-spacing:.22px;text-transform:uppercase}
.rail span{min-width:0;line-height:1.12;text-align:center;opacity:0;transform:translateY(3px);transition:opacity .26s,transform .26s}
.rail span:first-child{text-align:left}
.rail span.on{opacity:.72;transform:none}
.rail span.on:last-child{opacity:.96;color:rgba(228,218,172,.88)}
.tbtn{width:44px;height:44px;border:0;border-left:1px solid rgba(255,255,255,.07);background:transparent;color:rgba(240,236,227,.7);
  cursor:pointer;display:grid;place-items:center;padding:0}
.tbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tbtn:active{background:rgba(255,255,255,.045)}
.stage{position:relative;touch-action:manipulation;cursor:pointer}
.stage svg{display:block;width:100%;height:auto}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(4,17,7,.82);border:1px solid rgba(255,255,255,.14);
  border-radius:999px;padding:5px 12px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.scorechip{position:absolute;left:10px;top:10px;padding:4px 9px;border-radius:7px;background:rgba(4,17,7,.78);border:1px solid rgba(200,168,75,.45);
  color:#f0ece3;font-family:"Bebas Neue",Impact,sans-serif;font-size:17px;letter-spacing:.06em;pointer-events:none}
.scorechip b{color:var(--gold);font-weight:400}
.paused{position:absolute;right:10px;bottom:10px;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(240,236,227,.75);background:rgba(4,17,7,.7);border-radius:6px;padding:4px 7px;pointer-events:none}
.ink{min-height:34px;padding:3px 9px 7px;background:#08170b;text-align:center}
#ink{display:inline-block;padding:5px 10px 4px;border-bottom:1px solid rgba(211,226,103,.72);color:#eef2d4;
  font-family:Georgia,serif;font-size:15px;font-style:italic;font-weight:700;clip-path:inset(0 100% 0 0)}
#ink.on{animation:inkWrite .42s cubic-bezier(.22,.78,.25,1) forwards}
#ink.miss{border-bottom-color:rgba(224,112,112,.8);color:#f3d6d6}
@keyframes inkWrite{from{clip-path:inset(0 100% 0 0);filter:blur(1px)}to{clip-path:inset(0);filter:none}}

/* decision zone */
.zone{padding-top:12px}
.q{font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.35px;margin:0 0 12px;text-wrap:pretty}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.opt{width:100%;min-height:58px;padding:8px 9px;border:1px solid rgba(255,255,255,.12);border-radius:13px;background:rgba(255,255,255,.037);
  color:rgba(255,255,255,.88);display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:center;text-align:left;cursor:pointer;
  font-size:13.5px;line-height:1.28;transition:opacity .3s,filter .3s,transform .3s}
.opt .l{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:rgba(255,255,255,.07);color:rgba(255,255,255,.7);font-size:11px;font-weight:800}
.opt:not(:disabled):active{transform:scale(.992);border-color:rgba(211,226,103,.42)}
.opt:not(:disabled):hover{border-color:rgba(211,226,103,.42)}
.opt:disabled{cursor:default}
.zone.reading .q{opacity:.62}
.zone.reading .opt{opacity:.30;filter:saturate(.62);transform:translateY(4px)}
.opt.right{border-color:rgba(89,189,112,.82);background:rgba(89,189,112,.12);color:#fff}
.opt.right .l{background:var(--green);color:#071109}
.opt.wrong{border-color:rgba(224,112,112,.74);background:rgba(224,112,112,.10)}
.opt.wrong .l{background:var(--red);color:#170707}
.opt.hide{display:none}
.w{opacity:0;transition:opacity .28s ease}.w.on{opacity:1}
.setup .w.hot{color:#f3d68a}
.opt.picked{border-color:rgba(200,168,75,.85);background:rgba(200,168,75,.12);color:#fff}
.opt.picked .l{background:var(--gold);color:#120e04}
.review{margin:10px 0 0;padding:10px 0 0;border-top:1px solid rgba(255,255,255,.08)}
.review .rq{font-size:12px;opacity:.7;margin:0 0 2px}
.review .ra{margin:0 0 4px}
.review .ok{color:#8fd49a}.review .no{color:#f08a8a}
.review button{margin-top:4px}

/* feedback */
.fb{margin:10px 0 0;padding:11px 13px;border-left:2px solid var(--green);border-radius:4px 13px 13px 4px;background:rgba(89,189,112,.075);animation:rise .32s ease-out both}
.fb.miss{border-left-color:var(--gold);background:rgba(200,168,75,.065)}
.fb .lab{margin-bottom:5px;color:var(--green);font-size:9.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase}
.fb.miss .lab{color:var(--gold)}
.fb .copy{color:rgba(255,255,255,.84);font-size:14px;line-height:1.48}
.fb .prin{margin-top:6px;color:rgba(255,255,255,.58);font-size:12.5px;line-height:1.48}
.fb .tries{display:inline-block;margin:0 0 7px;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700}
.tries.good{background:rgba(89,189,112,.14);color:#8fd49c}.tries.mid{background:rgba(200,168,75,.14);color:var(--gold)}.tries.bad{background:rgba(224,112,112,.14);color:#f0a0a0}
.fbh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-7px -6px 1px 0}
.fbh .lab{margin:0}
.fbh .tries{margin:0 auto 0 0}
.why{min-width:62px;min-height:34px;margin:0;padding:5px 8px;border:0;background:transparent;color:var(--gold);cursor:pointer;
  font-size:12px;font-weight:800;letter-spacing:.4px;text-align:left}
.why span{display:inline-block;margin-left:3px;font-size:15px}
.whyp{margin-top:8px;padding-top:10px;border-top:1px solid rgba(255,255,255,.09);color:rgba(255,255,255,.6);font-size:12px;line-height:1.5}
.whyp p{margin:0 0 6px}
.acts{display:flex;gap:10px;align-items:center;margin:10px 0 0}
.acts .next{flex:1;margin:0}
.acts .alt{margin:0;flex:0 1 auto;text-align:left}
.next{width:100%;min-height:50px;margin:12px 0 0;border:0;border-radius:16px;background:var(--gold);color:#10130c;display:block;cursor:pointer;font-weight:800;font-size:14px;animation:rise .32s ease-out both}
.alt{display:block;margin:8px auto 0;min-height:40px;border:0;background:none;color:rgba(240,236,227,.66);font-size:13px;font-weight:600;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px}
.alt:hover{color:var(--ink)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* wrap-up */
.wrapup{margin-top:4px}
.wrapup .k{font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;font-weight:800;color:var(--gold)}
.wrapup .mem{font-family:"Bebas Neue",Impact,sans-serif;font-size:clamp(28px,7vw,36px);letter-spacing:.03em;line-height:1.02;margin:6px 0 14px;text-wrap:balance}
.wrapup .mem span{color:var(--gold)}
.wrapup .blk{border-top:1px solid rgba(255,255,255,.09);padding-top:12px;margin-top:12px}
.wrapup p{margin:5px 0 0;font-size:14px;line-height:1.5;color:rgba(255,255,255,.72)}
.wrapup p b{color:var(--ink);font-weight:600}
.wrapup .src{font-size:11.5px;color:rgba(255,255,255,.45)}
.wrapup a{color:var(--gold)}
.wrapup .credit{margin-top:22px;font-size:11px;line-height:1.5;color:rgba(255,255,255,.38)}
.wrapup .credit a{color:inherit}
.score3{display:flex;gap:6px;margin:2px 0 0}
.score3 i{width:22px;height:4px;border-radius:999px;background:rgba(255,255,255,.13)}
.score3 i.ok{background:var(--green)}.score3 i.no{background:var(--gold)}

/* full screen: watch only, with clear controls clear of the notch */
.visual.full .tools,.visual:fullscreen .tools{position:absolute;z-index:3;bottom:auto;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));left:auto;
  display:flex;min-height:0;padding:0;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(4,17,7,.72)}
.visual.full .tools .rail,.visual:fullscreen .tools .rail{display:none}
.visual.full .tbtn,.visual:fullscreen .tbtn{width:46px;height:46px;border-left:0;color:#f0ece3}
.visual.full .tbtn svg,.visual:fullscreen .tbtn svg{width:21px;height:21px}
/* full screen: watch only */
.visual.full,.visual:fullscreen{position:fixed;inset:0;z-index:50;border-radius:0;border:0;display:flex;flex-direction:column;
  padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.visual.full .stage,.visual:fullscreen .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.visual.full .stage svg,.visual:fullscreen .stage svg{width:100%;height:100%}
body.noscroll{overflow:hidden}

details.note{margin-top:30px;border-top:1px solid rgba(255,255,255,.08);padding-top:12px}
details.note summary{cursor:pointer;font-size:12px;color:rgba(255,255,255,.45);list-style:none;min-height:32px}
details.note summary::-webkit-details-marker{display:none}
details.note summary::after{content:" +";color:var(--gold)}
details.note[open] summary::after{content:" \2013"}
details.note p{margin:8px 0 0;font-size:12px;line-height:1.6;color:rgba(255,255,255,.55)}
details.note b{color:var(--ink);font-weight:500}
details.note a{color:var(--gold)}
[hidden]{display:none!important}
/* phone: the whole decision on one screen (no scrolling to answer or to reach Next) */
@media(max-width:600px){
  .shell{padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .head{min-height:40px;margin-bottom:4px;grid-template-columns:40px minmax(0,1fr) 40px}
  .ico{width:40px;height:40px;font-size:16px}
  .brand{font-size:17px}
  .meta{margin:0 0 5px}
  .setup{font-size:15px;line-height:1.35;margin:0 0 8px;min-height:2.7em}
  .tools{position:absolute;top:auto;bottom:32px;right:0;z-index:2;display:flex;min-height:0;padding:0;border:0;background:none}
  .paused{right:auto;left:10px;bottom:40px}
  .tbtn{width:38px;height:38px;border:0;color:rgba(240,236,227,.62)}
  .ink{min-height:32px;padding:3px 10px 5px;display:grid;align-items:center}
  .ink .rail{font-size:9px;gap:6px}.ink .rail span:first-child{text-align:center}
  .ink.has .rail{display:none}.ink:not(.has) #ink{display:none}
  #ink{font-size:14px;padding:4px 10px 3px;justify-self:center}
  .zone{padding-top:9px}
  .q{font-size:19px;margin:0 0 9px}
  .fb{margin-top:8px;padding:9px 12px}
  .fb .copy{font-size:13.5px;line-height:1.42}
  .fb .prin{margin-top:4px;font-size:12px;line-height:1.42}
  .zone.ans .q{display:none}
  .zone.ans .opt{min-height:46px;padding:6px 9px}
  .acts{margin-top:8px}.next{min-height:46px;border-radius:14px}
}
@media(max-width:360px){.shell{padding-left:12px;padding-right:12px}.rail{font-size:7px;gap:2px}.opt{font-size:13px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}
  .rail span{opacity:.72;transform:none}#ink{clip-path:none}}
</style>

<div class="shell">
  <header class="head">
    <button class="ico" id="back" aria-label="Back">&#8592;</button>
    <div class="brand">GAME<span>SHARP</span></div>
    <a class="ico" id="close" href="./" aria-label="Close">&#215;</a>
  </header>

  <div id="lessonView">
    <div class="meta"><span class="name" id="lessonName"></span><span class="count" id="count"></span></div>
    <p class="setup" id="sitTx"></p>

    <div class="visual" id="viewer">
      <div class="tools" id="tools">
        <div class="rail" id="rail" aria-hidden="true"></div>
        <button class="tbtn" id="playBtn" aria-label="Pause"><svg viewBox="0 0 24 24" id="playIcon"></svg></button>
        <button class="tbtn" id="camBtn" aria-label="Change camera"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
        <button class="tbtn" id="fsBtn" aria-label="Full screen"><svg viewBox="0 0 24 24" id="fsIcon"></svg></button>
        <button class="tbtn" id="again" aria-label="Replay"><svg viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></svg></button>
      </div>
      <div class="stage" id="stage">
        <svg id="svg" viewBox="0 0 820 470" role="img" aria-label="3D replay of the point"></svg>
        <div class="toast" id="toast"></div>
        <div class="paused" id="paused" hidden>Paused</div>
        <div class="scorechip" id="scorechip" hidden></div>
      </div>
      <div class="ink" id="inkRow"><span id="ink"></span></div>
    </div>

    <section class="zone reading" id="ask" aria-live="polite">
      <h1 class="q" id="askQ"></h1>
      <div class="opts" id="askOpts"></div>
      <div id="verdict" hidden></div>
    </section>
  </div>

  <div class="wrapup" id="wrapup" hidden></div>

</div>

const NARROW=matchMedia("(max-width:600px)"), PHONE_VH=540, PHONE_CYF=0.489, PHONE_FOV=0.8;
// Full screen on a phone: the stage takes the screen's shape, and fixed cameras zoom so the court fills it
function fitFull(){window.__pc=null; if(!isFull()) return; const C=camI===0&&LESSON.cam0?{...CAMS[0],...LESSON.cam0}:CAMS[camI];
  if(window.__camOverride) return;
  if(camI===0&&LESSON.closeUp){const s=Math.min(VH/PHONE_VH,1.6); FOCAL*=s; window.__pc=[VW/2, VH/2]; return;}   // a close-up keeps its framing, just bigger
  if(C.follow){const s=Math.min(VH/PHONE_VH,1.75); FOCAL*=s; window.__pc=[VW/2, VH-(PHONE_VH*(1-PHONE_CYF))*s*0.92]; return;}   // tall screen: zoom in, keep the lower part of the picture on screen
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const X of [-5.5,5.5]) for(const Y of [-14.2,14.2]) for(const Z of [0,2.0]){const q=toCam([X,Y,Z]); if(q.z<=ZNEAR) return;
    const u=q.x/q.z, v=q.y/q.z; x0=Math.min(x0,u);x1=Math.max(x1,u);y0=Math.min(y0,v);y1=Math.max(y1,v);}

  const r=$("rail"); if(NARROW.matches){if(r.parentNode.id!=="inkRow")$("inkRow").prepend(r);} else if(r.parentNode.id==="inkRow") $("tools").prepend(r);svg2.setAttribute("viewBox",`0 0 ${VW} ${VH}`);}
function serveMix(){const sc=SC[scene]; if(!sc) return 0; const W=prep(sc)["you"]; if(!W) return 0;
  for(const w of W){if(w.fixed||!w.s.clip.startsWith("serve")) continue; const a=w.s.start+20, b=w.cG+35;

  if(C.follow&&you){const h=you.pose[I.hips], ph=NARROW.matches;cam={az:-90,el:ph?13:11,d:ph?11:12,fov:50,tgt:[h[0]*0.7,h[1]+(ph?3.3:4.5),0.9]};   // a phone is taller: keep you higher in the frame

const LETTERS="ABCD", mode="daily";
function dotsOf(key){return SC[key]&&SC[key].info.dots||null;}
function endLabel(key){const ms=SC[key].marks, m=ms[ms.length-1]; if(!m)return "";
  const t=m.kind==="net"?"INTO THE NET":m.kind==="out"?"OUT · "+m.label:m.label; return t.charAt(0)+t.slice(1).toLowerCase();}

/* ---------- state ---------- */
let showDots=false, step=0, scene=null, t=0, stopAt=0, onStop=null, playing=false, lastTs=null;
let ans=[null,null,null], chosen=null, answered=false, showTargets=null, revealPattern=false, railOn=-1, done=false;
const svg2=$("svg"), zone=$("ask");

let stopTimer=null, stopGeneration=0, pendingStop=null;
function run(key,from,stop,cb){
  clearTimeout(stopTimer);stopTimer=null;pendingStop=null;stopGeneration++;
  scene=key;t=from;stopAt=Math.min(stop,SC[key].frames-1);onStop=cb;setPlaying(true);
}
function setPlaying(p){playing=p;lastTs=null;$("paused").hidden=p||t>=stopAt;
  const i=$("playIcon"); if(i){const pl=p&&t<stopAt; i.innerHTML=pl?PAUSE_I:PLAY_I; $("playBtn").setAttribute("aria-label",pl?"Pause":"Play");}}
const PAUSE_I='<path d="M9 5.5v13M15 5.5v13"/>', PLAY_I='<path d="M8 5.5l11 6.5-11 6.5z"/>';
function rate(){const sc=SC[scene];let r=1;
  for(const c of contactsOf(sc,"you")) r=Math.min(r,0.3+0.7*smooth(6,28,Math.abs(t-c)));
  if(onStop) r*=0.45+0.55*smooth(0,45,stopAt-t);
  return r;}
function tick(ts){
  if(playing){if(lastTs!=null){t+=Math.min(50,ts-lastTs)*0.1*rate()*(window.__speed||1);
      if(t>=stopAt){t=stopAt;setPlaying(false);const cb=onStop;onStop=null;
        if(cb){pendingStop=cb;const generation=stopGeneration;
          stopTimer=setTimeout(()=>{if(generation!==stopGeneration)return;stopTimer=null;pendingStop=null;cb();},220);}}}
    lastTs=ts;}
  render(); requestAnimationFrame(tick);
}

/* ---------- the visual card ---------- */
function railFor(S){return S.rail||(S.cues?["1 "+S.cues.ball,"2 You "+S.cues.you,"3 Them "+S.cues.opp]:[S.name]);}
function paintRail(list){$("rail").innerHTML=list.map(c=>`<span>${c}</span>`).join("");railOn=-1;setRail(0);}
function setRail(n){if(n===railOn)return;railOn=n;[...$("rail").children].forEach((s,i)=>s.classList.toggle("on",i<n));}
function setInk(txt,miss){const s=$("ink");s.className="";s.textContent=txt||"";s.parentNode.classList.toggle("has",!!txt);if(!txt)return;void s.offsetWidth;s.className="on"+(miss?" miss":"");}
let toastT=0;
function toast(txt){const e=$("toast");e.textContent=txt;e.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("on"),1300);}
function stageInView(){const r=$("viewer").getBoundingClientRect();
  if(r.top<0||r.top>innerHeight*0.45) window.scrollTo({top:scrollY+r.top-72,behavior:"smooth"});}

/* ---------- the decision zone ---------- */

}

}
let pick=()=>{};
function optEl(X){return $("askOpts").children[LETTERS.indexOf(X)];}

/* ---------- lesson flow ---------- */
function startStep(i){
  step=i; chosen=null; answered=false; showTargets=null; revealPattern=false; showDots=false; done=false;
  $("wrapup").hidden=true; setInk("");
  if(i===3){finishLesson();return;}
  const S=LESSON.steps[i];
  $("count").textContent=`${i+1} of 3`; $("sitTx").innerHTML=S.sit;
  paintRail(railFor(S)); paintAsk(S);
  pick=X=>choose(i,X,false);
  const key=S.reveal?S.scene:S.scene+"A", fr=SC[key].info.freeze;
  run(key,SC[key].info.from||0,fr,()=>{ if(!S.reveal&&!S.noTargets) showTargets=S.scene; enableAsk(); });   // a later read in one point starts near its decision
}
// Play one option out. demo = watching the better option after a miss (the first answer still counts).
function choose(i,X,demo){
  const S=LESSON.steps[i];
  if(!demo&&ans[i]==null) ans[i]=X;
  chosen=X; answered=true; zone.classList.remove("on"); showOnly([X]); setRail(3); setInk("");
  $("verdict").hidden=true;
  if(S.reveal){showDots=true;if(S.pattern)revealPattern=true;verdict(i,X,demo);return;}
  showDots=!!LESSON.tenTries;
  const key=S.scene+X, fr=SC[key].info.freeze;
  run(key,demo?Math.max(0,fr-45):t,SC[key].frames-1,()=>verdict(i,X,demo));
  stageInView();
}
function verdict(i,X,demo){
  const S=LESSON.steps[i], also=(S.alsoOk||[]).includes(LETTERS.indexOf(X)), ok=LETTERS.indexOf(X)===S.correct||also, corr=LETTERS[S.correct];
  const d=dotsOf(S.reveal?S.scene:S.scene+X), n=d?d.filter(x=>x[2]).length:0;
  showOnly(ok||demo?[X]:[X,corr]);
  optEl(X).classList.add(ok?"right":"wrong"); if(!ok&&!demo) optEl(corr).classList.add("right");
  setInk(ok||S.reveal?S.unlock:endLabel(S.scene+X),!ok&&!S.reveal);
  const lab=demo?`Option ${X}`:also?`Also works · best: ${corr}`:ok?"Good read":`Better: ${corr}`;
  const v=$("verdict");
  zone.classList.add("ans");
  v.innerHTML=`<div class="fb${ok?"":" miss"}"><div class="fbh"><div class="lab">${lab}</div>${d?`<div class="tries ${n>=9?"good":n>=7?"mid":"bad"}">In ${n} of 10 tries</div>`:""}<button class="why" id="why" aria-expanded="false" aria-controls="whyp">Why? <span aria-hidden="true">+</span></button></div>
      <div class="copy">${S.lines[X]}</div>
      <div class="prin">${S.take}</div>
      <div class="whyp" id="whyp" hidden><p>${S.payoff}</p><p>${S.principle}</p><p>${S.why}</p></div></div>
    <div class="acts">${S.reveal?"":`<button class="alt" id="tryOther">${ok||demo?"Try another":`Watch ${corr} play out`}</button>`}
    <button class="next" id="next">${i<2?"Next decision →":"Take it to court →"}</button></div>`;
  v.hidden=false;
  $("why").onclick=()=>{const p=$("whyp"),o=p.hidden;p.hidden=!o;$("why").setAttribute("aria-expanded",o);$("why").innerHTML=`Why? <span aria-hidden="true">${o?"–":"+"}</span>`;};
  $("next").onclick=()=>{startStep(i+1);window.scrollTo({top:0,behavior:"smooth"});};
  if(!S.reveal) $("tryOther").onclick=()=>{
    if(!ok&&!demo){choose(i,corr,true);return;}
    const key=S.reveal?S.scene:S.scene+"A", fr=SC[key].info.freeze;
    chosen=null; answered=false; showDots=false; setInk(""); paintAsk(S); pick=Y=>choose(i,Y,true);
    if(!S.reveal&&!S.noTargets) showTargets=S.scene;

}
function finishLesson(){
  done=true; const okA=(a,i)=>a!=null&&(LETTERS.indexOf(a)===LESSON.steps[i].correct||(LESSON.steps[i].alsoOk||[]).includes(LETTERS.indexOf(a)));
  const n=ans.filter(okA).length;
  $("count").textContent="Done"; $("sitTx").innerHTML=LESSON.hook;

    <div class="blk"><div class="k">Take it to court</div><p><b>${LESSON.tomorrow}</b></p></div>
    ${p?`<div class="blk"><div class="k">Pro Lens · ${p.player}</div><p>${p.moment}</p><p><b>${p.read}</b></p>

    <button class="next" id="redo">${LESSON.redoLabel||"Start the lesson again"}</button>
    <p class="credit">Swings are motion-captured from real players (Tennis-MoCap, Pulgar&iacute;n-Giraldo et al., <a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a>), then edited (a few lifted to a higher contact) and placed on court. The racquet, the running and the ball flight are modelled.</p>`;
  w.hidden=false; $("redo").onclick=()=>{ans=[null,null,null];startStep(0);window.scrollTo({top:0,behavior:"smooth"});};
  {const k=LESSON.finaleScene;run(k,LESSON.finaleFull?0:Math.max(0,SC[k].info.freeze-40),SC[k].frames-1,null);}

/* ---------- render ---------- */
function render(){
  const sc=SC[scene], g=t, you=actorAt(sc,"you",g), opp=actorAt(sc,"opp",g);
  setCamera(you); buildBasis(); fitFull();
  const frag=document.createDocumentFragment(); drawCourt(frag);
  // last point's reply, as evidence
  if(scene==="daily1"){const E=sc.info.evidence;for(let i=1;i<E.length;i++){if(E[i][2]<0.02&&i<E.length-1)continue;
      seg(frag,E[i-1],E[i],"rgba(240,236,227,.5)",1.4,.55);}
    const e=E[E.length-1];ring(frag,[e[0],e[1],0.006],0.16,0.12,"rgba(240,236,227,.7)",1.4,.8);
    label(frag,[e[0],e[1],0],"LAST POINT","rgba(240,236,227,.8)",14,.9,-18);}
  const St0=mode==="daily"&&step<3?LESSON.steps[step]:null, fz0=St0&&scene.startsWith(St0.scene)?SC[scene].info.freeze:null;
  const cueOnEarly=fz0!=null&&St0.cues&&g>=fz0-3&&g<=fz0+10;
  // bounces and landings
  for(const m of sc.marks){if(g<m.frame)continue;const age=g-m.frame, p=[m.pos[0],m.pos[1],0.006];
    const fin=m.kind==="land"||m.kind==="reply"||m.kind==="out"||m.kind==="rally"||m.kind==="contact";
    const col=m.kind==="net"||m.kind==="out"?"var(--warn)":m.kind==="reply"?"#9fb8d6":(m.kind==="rally"||m.kind==="contact")?"#f0ece3":fin?"var(--accent)":"var(--ball)";
    const txtCol=m.kind==="out"?"#f08a8a":m.kind==="reply"?"#c9d8ea":(m.kind==="rally"||m.kind==="contact")?"#f0ece3":fin?"#c8a84b":"#f0ece3";
    if(m.kind!=="net"){ring(frag,p,0.1+0.26*smooth(0,14,age),0.08+0.2*smooth(0,14,age),col,1.6,fin?0.95:0.35+0.4*(1-smooth(60,160,age)));
      if(fin) ring(frag,p,0.1,0.075,"none",0,.9,col);}
    const show=fin||age<130||(revealPattern&&m.label==="SHORT MIDDLE");
    const txt=revealPattern&&m.label==="SHORT MIDDLE"?"SHORT MIDDLE \u00d7"+"2":m.kind==="out"?"OUT \u00b7 "+m.label:m.label;
    if(show&&m.label&&m.kind!=="net"&&!(cueOnEarly&&!fin)) label(frag,[m.pos[0],m.pos[1],0],txt,txtCol,fin?18:15,fin?1:1-smooth(90,130,age)*(revealPattern?0:1));}
  // evidence from earlier points: faint landing rings, one label
  if(sc.info.ghosts){let cx=0,cy=0;const G=sc.info.ghosts;
    for(const [x,y,l] of G){cx+=x/G.length;cy+=y/G.length;ring(frag,[x,y,0.006],0.22,0.17,sc.info.ghostCol||"rgba(240,236,227,.55)",1.4,.8);
      if(l&&g<=(sc.info.ghostUntil??sc.info.freeze+20)) label(frag,[x,y+(y<0?-1.0:-1.1),0],l,"rgba(240,236,227,.85)",13,.9,0);}
    if(sc.info.ghostLabel&&g<=(sc.info.ghostUntil??sc.info.freeze+20)) label(frag,[cx,cy+(cy<0?-1.4:-1.4),0],sc.info.ghostLabel,"rgba(240,236,227,.85)",14,.9,0);}
  // ten tries of the chosen plan: where they land
  const DT=sc.info.dots;
  if(showDots&&DT){const nx=sc.marks.find(m=>m.frame>sc.info.freeze), t0=nx?nx.frame:sc.info.freeze;
    if(g>=t0){const a=smooth(0,25,g-t0);
      let cx=0,cy=0;for(const [x,y,ok] of DT){cx+=x/DT.length;cy+=y/DT.length;
        ring(frag,[x,y,0.008],0.2,0.16,ok?"#7fbf7a":"#e05252",1.8,.95*a,ok?"rgba(127,191,122,.55)":"rgba(224,82,82,.55)");}
      const n=DT.filter(d=>d[2]).length; label(frag,[cx,cy-(cy>0?2.8:-2.8),0],`${n} OF 10 IN`,n>=9?"#9fd89a":n>=7?"#c8a84b":"#f08a8a",19,a,0);}}
  // decision targets
  if(showTargets){const L=[...LETTERS].map(X=>SC[showTargets+X].info.shot.land), dx=[0,0,0,0];
    for(let a=0;a<4;a++)for(let c=a+1;c<4;c++)if(Math.hypot(L[a][0]-L[c][0],L[a][1]-L[c][1])<1.0){const s=L[a][0]<=L[c][0]?1:-1;dx[a]-=0.45*s;dx[c]+=0.45*s;}   // keep close letters apart
    for(let k=0;k<4;k++){const X=LETTERS[k], p=[L[k][0],L[k][1],0.006], on=chosen===X;
      if(chosen&&!on) continue;
      ring(frag,p,0.34,0.28,on?"var(--accent)":"rgba(240,236,227,.6)",on?2:1.3,on?.95:.75);
      label(frag,[p[0]+dx[k],p[1],0],X,on?"#c8a84b":"#f0ece3",19,1,6);}}
  // Predict the Point: the picks so far, stitched on court as shot tracers
  if(window.__trail) for(const tr of window.__trail){const a=Math.min(1,(performance.now()-tr.t0)/1000), e=a*a*(3-2*a), n=40, pts=[];
    const at=u=>[lerp(tr.from[0],tr.to[0],u),lerp(tr.from[1],tr.to[1],u),lerp(tr.h,0.02,u)+1.6*u*(1-u)*tr.arc];
    for(let k=0;k<=Math.round(n*e);k++) pts.push(at(k/n));
    // a tracer: bright near its head, fading behind it; once it lands it settles to a steady line
    for(let k=1;k<pts.length;k++){const behind=(pts.length-1-k)/n, op=a<1?Math.max(0.18,1-behind*2.2):.85;
      seg(frag,pts[k-1],pts[k],tr.col,a<1?2.8:2.2,op);}
    if(a<1&&pts.length){const hd=P(pts[pts.length-1]); if(hd){frag.appendChild(el_("circle",{cx:hd.s[0].toFixed(1),cy:hd.s[1].toFixed(1),r:9,fill:tr.col,opacity:.25}));
      frag.appendChild(el_("circle",{cx:hd.s[0].toFixed(1),cy:hd.s[1].toFixed(1),r:3.6,fill:"#fff8dc"}));}}
    if(a>=1){ring(frag,[tr.to[0],tr.to[1],0.006],0.34,0.28,tr.col,2,.95);label(frag,[tr.to[0],tr.to[1],0],tr.X,tr.col,19,1,6);}}
  // depth-sorted: net, bodies, ball
  const parts=[];
  parts.push({n:netGroup(),z:toCam([0,0,0.5]).z});
  const shadow=(a,op)=>{if(!a)return;const x=(a.pose[I.ankleL][0]+a.pose[I.ankleR][0])/2,y=(a.pose[I.ankleL][1]+a.pose[I.ankleR][1])/2;
    ring(frag,[x,y,0.004],0.38,0.3,"none",0,op,"rgba(0,0,0,.35)");};
  shadow(you,1);shadow(opp,.8);
  if(opp) drawFigure(parts,opp.pose,opp.rq,{kit:OPPKIT,op:.95,fwd:opp.fwd});
  if(you){drawFigure(parts,you.pose,you.rq,{fwd:you.fwd});
    for(const c of contactsOf(sc,"you")) if(Math.abs(g-c)<16){const W=prep(sc).you.find(w=>w.cG===c);
      for(let f=Math.max(c-14,Math.floor(g)-12);f<=Math.floor(g);f++){const a=actorAt(sc,"you",f-1),b=actorAt(sc,"you",f);
        seg(frag,a.pose[I.racquetTip],b.pose[I.racquetTip],"var(--accent)",2,0.12+0.5*(1-(g-f)/12));}}}
  const b=ballAt(sc,g);
  if(b){const gtrail=el_("g",{});let prev=null;
    for(let f=Math.max(firstBall(sc),Math.floor(g)-20);f<=Math.floor(g);f++){const q=sc.ball[f];if(!q){prev=null;continue;}
      if(prev) seg(gtrail,prev,q,"var(--ball)",1.6,0.08+0.5*(1-(g-f)/20));prev=q;}
    const qb=P(b);
    if(qb){parts.push({n:gtrail,z:qb.z+0.05});
      if(b[2]>0.05) ring(frag,[b[0],b[1],0.004],0.05,0.04,"none",0,.55,"rgba(0,0,0,.6)");
      const toss=g<firstBall(sc), rr=Math.max(toss?3.6:2.8,FOCAL*0.033/qb.z), zb=toss?qb.z-3:qb.z;   // the toss is drawn in front of the server so it can always be seen
      parts.push({n:el_("circle",{cx:qb.s[0].toFixed(1),cy:qb.s[1].toFixed(1),r:(rr*2.6).toFixed(1),fill:"var(--ball)",opacity:toss?.28:.18}),z:zb+0.01});
      parts.push({n:el_("circle",{cx:qb.s[0].toFixed(1),cy:qb.s[1].toFixed(1),r:rr.toFixed(1),fill:"var(--ball)",stroke:"#6f7d10","stroke-width":.6}),z:zb-0.02});}}
  parts.sort((a,b)=>b.z-a.z); for(const {n} of parts) frag.appendChild(n);
  const St=mode==="daily"&&step<3?LESSON.steps[step]:null, fz=St&&scene.startsWith(St.scene)?SC[scene].info.freeze:null;
  const cueOn=fz!=null&&St.cues&&g>=fz-3&&g<=fz+10;
  if(cueOn){const bb=ballAt(sc,g);
    if(bb){seg(frag,[bb[0],bb[1],0.01],bb,"var(--ball)",2,.9);seg(frag,[bb[0]-0.12,bb[1],0.01],[bb[0]+0.12,bb[1],0.01],"var(--ball)",2,.9);
      label(frag,[bb[0]+1.0,bb[1]-0.3,0],St.cues.ball,"#e8f27a",15,1,0);}}
  if(cueOn||!playing||g<160){const hp=a=>a&&add(a.pose[I.head],[0,0,0.42]);
    if(you) label(frag,hp(you),cueOn?"YOU \u00b7 "+St.cues.you:"YOU","#c8a84b",15,.95,0);
    if(opp) label(frag,hp(opp),cueOn?"THEM \u00b7 "+St.cues.opp:"THEM","#9fb8d6",15,.95,0);}
  // timing flashes: THEIR HIT / LAND / GO
  if(sc.info.flashes) for(const [f,who,txt] of sc.info.flashes){if(g<f||g>f+45)continue;const a=who==="you"?you:opp;if(!a)continue;
    label(frag,add(a.pose[I.head],[0,0,1.25]),txt,who==="you"?"#e8f27a":"#c9d8ea",18,1-smooth(30,45,g-f),0);}
  // net fault
  for(const m of sc.marks) if(m.kind==="net"&&g>=m.frame){const bp=sc.ball[m.frame]||b;if(bp){const q=P(bp);
    if(q)frag.appendChild(el_("circle",{cx:q.s[0].toFixed(1),cy:q.s[1].toFixed(1),r:(8+10*smooth(0,20,g-m.frame)).toFixed(1),fill:"none",stroke:"#e05252","stroke-width":2.2,opacity:1-0.5*smooth(0,30,g-m.frame)}));}}
  svg2.replaceChildren(frag);
  {const sc2=$("scorechip"), v=sc.info.score||""; if(sc2.dataset.v!==v){sc2.dataset.v=v;sc2.hidden=!v;sc2.innerHTML=v?"YOU <b>"+v+"</b>":"";}}
  if(St&&fz!=null){const n=answered?3:[0,1,2].filter(k=>g>=fz-80+30*k).length;setRail(n);}
}

/* ---------- controls ---------- */
$("camBtn").onclick=()=>{camI=(camI+1)%CAMS.length;toast(CAMS[camI].n);};
$("stage").onclick=()=>{if(t<stopAt){setPlaying(!playing);}};
$("playBtn").onclick=()=>{if(t<stopAt) setPlaying(!playing); else $("again").click();};
$("again").onclick=()=>{
  if(done){const k=LESSON.finaleScene;run(k,LESSON.finaleFull?0:Math.max(0,SC[k].info.freeze-40),SC[k].frames-1,null);return;}
  const S=LESSON.steps[step];
  if(!answered){
    zone.classList.add("reading");zone.classList.remove("on");
    $("askOpts").querySelectorAll(".opt").forEach(b=>{b.disabled=true;});
    const key=S.reveal?S.scene:S.scene+"A";run(key,0,SC[key].info.freeze,()=>{if(!S.reveal&&!S.noTargets)showTargets=S.scene;enableAsk();});return;}
  if(S.reveal) return;
  // Preserve feedback when Replay interrupts a choice, including the completion delay.
  const resume=onStop||pendingStop;
  const key=S.scene+chosen, fr=SC[key].info.freeze; run(key,Math.max(0,fr-60),SC[key].frames-1,resume);};
$("back").onclick=()=>{if(step>0&&!done){startStep(step-1);} else if(done){startStep(2);} else location.href="./";};
const FS_IN='<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>',
      FS_OUT='<path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/>';
const viewer=$("viewer");
function isFull(){return !!(document.fullscreenElement||document.webkitFullscreenElement||viewer.classList.contains("full"));}
function paintFs(){$("fsIcon").innerHTML=isFull()?FS_OUT:FS_IN;document.body.classList.toggle("noscroll",isFull());requestAnimationFrame(fullView);}
async function exitFull(){if(document.fullscreenElement)await document.exitFullscreen().catch(()=>{});viewer.classList.remove("full");paintFs();}
$("fsBtn").onclick=async()=>{
  if(isFull()){exitFull();return;}
  try{if(viewer.requestFullscreen)await viewer.requestFullscreen();else throw 0;}catch(e){viewer.classList.add("full");}
  paintFs();};
document.addEventListener("fullscreenchange",paintFs);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&viewer.classList.contains("full")){viewer.classList.remove("full");paintFs();}});
paintFs();
fitView();NARROW.addEventListener?.("change",fitView);addEventListener("resize",()=>{if(isFull())fullView();});

/* ---------- Predict the Point: answer every read first, then watch the whole point ---------- */
function setupPredict(){
  const P=LESSON.predict, K=P.scene; let savedTrail=null, typeT=[];
  // read the sentence in, a word at a time, so the eye follows it
  function typeIn(el,html,done,wps){typeT.forEach(clearTimeout);typeT=[];
    const words=html.split(/\s+/).filter(Boolean); el.innerHTML=words.map(w=>`<span class="w">${w}</span>`).join(" ");
    const spans=[...el.querySelectorAll(".w")], dt=1000/(wps||5.5);
    spans.forEach((s,k)=>typeT.push(setTimeout(()=>{s.classList.add("on");},k*dt)));
    if(done) typeT.push(setTimeout(done,spans.length*dt+150));}
  const readAt=P.reads.map(r=>typeof r==="string"?SC[r].info.freeze:r);
  // where you strike each of the three shots, on the best line
  const hitFrom=(()=>{const sc=SC[K], segs=(sc.actors.you||[]).filter(s=>!s.hold).map(s=>s.start+CL[s.clip].contactFrame-1);
    return segs.slice(0,3).map(f=>{const q=sc.ball[f]||sc.ball[f+1];return q?[q[0],q[1],q[2]]:[0,-11,1];});})();
  const okAt=i=>ans[i]!=null&&(LETTERS.indexOf(ans[i])===LESSON.steps[i].correct||(LESSON.steps[i].alsoOk||[]).includes(LETTERS.indexOf(ans[i])));
  startStep=function(i){
    step=i; chosen=null; answered=false; showTargets=null; showDots=false; done=false;
    $("wrapup").hidden=true;
    if(i===3){watchPoint();return;}
    const S=LESSON.steps[i];
    $("count").textContent=`Read ${i+1} of 3`;
    paintRail(i===0?[P.intro||"Picture the point"]:LESSON.steps.slice(0,i).map((s,j)=>`${j+1} ${s.short}: ${ans[j]||"–"}`)); setInk(i===0?"Answer all three, then watch":"");
    paintAsk(S); zone.hidden=false;
    scene=K; t=readAt[0]; stopAt=t; setPlaying(false);
    window.__camOverride=P.askCam||null; if(i===0) savedTrail=null; window.__trail=(window.__trail||[]).slice(0,i); showTargets=S.scene;
    pick=X=>{ans[i]=X; optEl(X).classList.add("picked"); showOnly([X]); showTargets=null;
      const land=SC[S.scene+X].info.shot.land;
      window.__trail.push({from:hitFrom[i],to:land,h:hitFrom[i][2],arc:i===0?0.4:1,X,col:"#c8a84b",t0:performance.now()});
      setTimeout(()=>startStep(i+1),1700);};
    typeIn($("sitTx"),S.sit,enableAsk);   // the options open once the situation has been read in
  };
  function chip(k){const S=LESSON.steps[k],ok=okAt(k); typeIn($("sitTx"),(P.says&&P.says[k])||S.payoff,null,6);   // say what just happened const tr=savedTrail[k]; if(tr){window.__trail.push({...tr,col:ok?"#7fbf7a":"#e05252",t0:performance.now()});}
    setInk(ok?`Read ${k+1} · ${S.short}: you had it`:`Read ${k+1} · ${S.short}: you said ${ans[k]}, best is ${LETTERS[S.correct]}`,!ok);}
  function watchPoint(){
    window.__camOverride=null; savedTrail=(savedTrail&&savedTrail.length===3?savedTrail:(window.__trail||[])).map(x=>({...x})); window.__trail=[];   // redrawn read by read as the point plays
    zone.hidden=true; $("count").textContent="The point"; typeIn($("sitTx"),P.watch||"Now watch the point you pictured.");
    paintRail(LESSON.steps.map((s,j)=>`${j+1} ${s.short}`)); setInk(""); stageInView();
    let k=0;
    const next=()=>{
      if(k<readAt.length){const from=k?readAt[k-1]:0; run(K,from,readAt[k],()=>{chip(k);setRail(k+1);k++;setTimeout(next,1700);});}
      else run(K,readAt[readAt.length-1],SC[K].frames-1,()=>setTimeout(review,600));};
    next();
  }
  function review(){
    done=true; const n=[0,1,2].filter(okAt).length; typeT.forEach(clearTimeout);
    $("count").textContent="Done"; $("sitTx").innerHTML=LESSON.hook; setInk(`${n} of 3 read right`,false);
    const w=$("wrapup");
    w.innerHTML=`<div class="blk" style="border:0;margin:14px 0 0;padding:0"><div class="k">Remember</div><div class="mem">${LESSON.memHTML}</div>
      <div class="score3">${ans.map((a,i)=>`<i class="${okAt(i)?"ok":"no"}"></i>`).join("")}</div></div>
      ${LESSON.steps.map((S,i)=>{const X=ans[i],ok=okAt(i);return `<div class="review"><p class="rq">Read ${i+1} · ${S.q}</p>
        <p class="ra ${ok?"ok":"no"}">${ok?"✓":"✗"} You: ${S.opts[LETTERS.indexOf(X)]}</p><p>${S.lines[X]}</p>
        ${ok?"":`<p><b>Best: ${S.opts[S.correct]}.</b> ${S.payoff}</p><button class="alt" data-watch="${i}">Watch your choice play out</button>`}</div>`;}).join("")}
      <div class="blk"><div class="k">Take it to court</div><p><b>${LESSON.tomorrow}</b></p></div>
      <button class="next" id="redo">${LESSON.redoLabel||"Play again"}</button>
      <p class="credit">Swings are motion-captured from real players (Tennis-MoCap, Pulgar&iacute;n-Giraldo et al., <a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a>), then edited (a few lifted to a higher contact) and placed on court. The racquet, the running and the ball flight are modelled.</p>`;
    w.hidden=false;
    w.querySelectorAll("[data-watch]").forEach(bt=>bt.onclick=()=>{const i=+bt.dataset.watch,key=LESSON.steps[i].scene+ans[i],fr=SC[key].info.freeze;
      stageInView(); setInk(`Read ${i+1}: your choice`,true); run(key,Math.max(0,(SC[key].info.from||fr-60)),SC[key].frames-1,null);});
    $("redo").onclick=()=>{ans=[null,null,null];window.__trail=[];startStep(0);window.scrollTo({top:0,behavior:"smooth"});};
  }
  $("again").onclick=()=>{if(done||step===3){startStep(3);} };
}
if(LESSON.predict) setupPredict();

$("lessonName").textContent=LESSON.title;
startStep(0);
requestAnimationFrame(tick);
window.__test={SC,go:(k,f)=>{scene=k;t=f;setPlaying(false);},setCam:i=>{camI=i;},state:()=>({mode,step,scene,t,stopAt,playing})};
</script>
