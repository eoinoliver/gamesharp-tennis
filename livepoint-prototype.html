<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>GAMESHARP · Live Point</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#c8a84b; --gold-light:#e2c570;
  --dark:#111111; --card:#1a1a1a;
  --white:#f0ece3; --muted:rgba(255,255,255,.55);
  --win:#5bba6f; --weak:#c98a4b; --bad:#e07070;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--dark);color:var(--white);font-family:'DM Sans',sans-serif;min-height:100dvh;overflow-x:hidden;}
body{padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 24px);max-width:480px;margin:0 auto;}
.wm{font-family:'DM Sans';font-weight:800;font-size:22px;letter-spacing:-.5px;line-height:1;}
.wm span{color:var(--gold);}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.sub{font-size:12px;color:var(--muted);margin-top:3px;}

/* Scenario picker */
.deck{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none;-ms-overflow-style:none;}
.deck::-webkit-scrollbar{display:none;}
.chip{flex:none;background:var(--card);border:1.5px solid rgba(255,255,255,.1);border-radius:22px;padding:8px 14px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;font-family:inherit;transition:border-color .18s,color .18s;}
.chip.on{border-color:var(--gold);color:var(--gold-light);background:rgba(200,168,75,.08);}

.badge-type{display:block;background:rgba(200,168,75,.1);border:1px solid rgba(200,168,75,.28);border-radius:13px;padding:10px 14px;font-size:12px;line-height:1.45;color:var(--gold-light);font-weight:500;margin-top:10px;}
.badge-type .k{font-size:9.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-right:5px;}
.badge-type b{color:var(--white);font-weight:800;}

.court-wrap{margin:14px 0 4px;border-radius:16px;overflow:hidden;background:radial-gradient(120% 90% at 50% 12%,#0e2312,#070d08);border:1px solid rgba(255,255,255,.06);position:relative;}
.court-label{position:absolute;top:9px;left:12px;font-size:8.5px;letter-spacing:1.4px;font-weight:800;color:rgba(200,168,75,.9);z-index:2;text-shadow:0 1px 3px rgba(0,0,0,.6);}
.court-label b{color:#fff;font-weight:800;}
.ms-svg{width:100%;height:auto;display:block;}
@keyframes drawPath{to{stroke-dashoffset:0}}
@keyframes tpop{from{opacity:0;transform-origin:center;transform:scale(0.2)}to{opacity:1;transform:scale(1)}}
@keyframes pbPayoff{0%{opacity:0;transform:scale(.35)}45%{opacity:1;transform:scale(1.18)}100%{opacity:1;transform:scale(1)}}
.pb-payoff-pulse{transform-box:fill-box;transform-origin:center;animation:pbPayoff 1.15s ease-out both;}

.sit{font-size:14.5px;line-height:1.5;color:rgba(255,255,255,.9);margin:16px 2px 4px;min-height:20px;}
.q{font-size:17px;font-weight:700;line-height:1.35;margin:8px 2px 14px;}

.opts{display:flex;flex-direction:column;gap:10px;}
.opt{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid rgba(255,255,255,.1);border-radius:14px;padding:14px 15px;cursor:pointer;text-align:left;transition:border-color .18s,background .18s,transform .12s;font-family:inherit;color:var(--white);width:100%;}
.opt:active{transform:scale(.985);}
.opt-ltr{width:30px;height:30px;flex:none;border-radius:9px;background:rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:rgba(255,255,255,.85);}
.opt-body{flex:1;min-width:0;}
.opt-lbl{font-size:14.5px;font-weight:700;line-height:1.2;}
.opt-sub{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.3;}
.opt.locked{pointer-events:none;}
.opt.chosen.good{border-color:var(--win);background:rgba(91,186,111,.1);}
.opt.chosen.mid{border-color:var(--weak);background:rgba(201,138,75,.1);}
.opt.correct-ghost{border-color:rgba(91,186,111,.5);}

.reveal{margin-top:14px;border-radius:14px;padding:14px 16px;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s;border:1px solid;}
.reveal.show{opacity:1;transform:none;}
.reveal.good{background:rgba(91,186,111,.09);border-color:rgba(91,186,111,.35);}
.reveal.mid{background:rgba(201,138,75,.09);border-color:rgba(201,138,75,.32);}
.reveal.info{background:rgba(200,168,75,.07);border-color:rgba(200,168,75,.28);}
.reveal-tag{font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;}
.reveal.good .reveal-tag{color:var(--win);}
.reveal.mid .reveal-tag{color:var(--weak);}
.reveal.info .reveal-tag{color:var(--gold);}
.reveal-txt{font-size:13.5px;line-height:1.55;color:rgba(255,255,255,.9);}

.btn{display:block;width:100%;background:var(--gold);color:#111;border:none;border-radius:13px;padding:15px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:16px;transition:transform .12s;}
.btn:active{transform:scale(.98);}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px solid rgba(255,255,255,.14);margin-top:10px;}

.result-title{font-family:'DM Sans';font-weight:800;font-size:30px;letter-spacing:-.5px;line-height:1;margin:2px 0 8px;}
.result-title.win{color:var(--win);}
.result-title.neutral{color:var(--gold-light);}

.step-dots{display:flex;gap:6px;justify-content:center;margin:8px 0 0;}
.sd{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.16);}
.sd.on{background:var(--gold);}
.sd.done{background:rgba(200,168,75,.45);}
.foot{text-align:center;font-size:11px;color:rgba(255,255,255,.32);margin-top:18px;}
</style>
</head>
<body>

  <div class="head">
    <div class="wm">GAME<span>SHARP</span></div>
    <div class="eyebrow">Live Point</div>
  </div>
  <div class="sub">Your reward for finishing today's four. Play it out.</div>

  <div class="deck" id="deck"></div>

  <div class="badge-type" id="badge"></div>

  <div class="court-wrap">
    <div class="court-label">◉ GAME<b>SHARP</b> REPLAY · LIVE POINT</div>
    <div id="court"></div>
  </div>
  <div class="step-dots" id="dots"></div>

  <div id="stage"></div>

  <div class="foot">Prototype · rendered in the Playbook's broadcast language.</div>

<script>
"use strict";
const GOLD='#c8a84b', RED='#e07070', GREEN='#5bba6f';

/* ─────────────────────────────  SOUND  ───────────────────────────── */
const SND=(()=>{
  let ctx=null,master=null;
  function ac(){
    if(!ctx){
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      master=ctx.createGain();master.gain.value=.85;
      const comp=ctx.createDynamicsCompressor();
      comp.threshold.value=-14;comp.knee.value=12;comp.ratio.value=8;comp.attack.value=.002;comp.release.value=.18;
      master.connect(comp);comp.connect(ctx.destination);
    }
    return ctx;
  }
  function nbuf(dur){const c=ac();const n=Math.max(1,(c.sampleRate*dur)|0);const b=c.createBuffer(1,n,c.sampleRate);const d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return b;}
  function tone(f,dur,g,type,delay){const c=ac(),t=c.currentTime+(delay||0);const o=c.createOscillator(),ga=c.createGain();o.type=type||'sine';o.frequency.value=f;ga.gain.setValueAtTime(0,t);ga.gain.linearRampToValueAtTime(g,t+.02);ga.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(ga);ga.connect(master);o.start(t);o.stop(t+dur+.03);}
  function strike({body=440,bright=2600,dur=.1,gain=.5,bgain=.4,decay=null}){
    const c=ac(),t=c.currentTime,dk=decay||dur;
    const s=c.createBufferSource();s.buffer=nbuf(dur*1.1);
    const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=bright;bp.Q.value=.7;
    const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=700;
    const ng=c.createGain();ng.gain.setValueAtTime(bgain,t);ng.gain.exponentialRampToValueAtTime(.0001,t+dur*.6);
    s.connect(bp);bp.connect(hp);hp.connect(ng);ng.connect(master);s.start(t);s.stop(t+dur*1.1);
    const o=c.createOscillator();o.type='triangle';
    o.frequency.setValueAtTime(body*2,t);o.frequency.exponentialRampToValueAtTime(body,t+.028);
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=body*6;
    const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+dk);
    o.connect(lp);lp.connect(g);g.connect(master);o.start(t);o.stop(t+dk+.05);
  }
  function crowd(dur,gain){const c=ac(),t=c.currentTime;const s=c.createBufferSource();s.buffer=nbuf(dur);const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1300;const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+dur*.4);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(lp);lp.connect(g);g.connect(master);s.start(t);s.stop(t+dur);}
  const safe=fn=>{try{fn();}catch(e){}};
  return {
    drive(){safe(()=>strike({body:420,bright:2600,dur:.11,gain:.5,bgain:.42}));},
    slice(){safe(()=>strike({body:720,bright:3600,dur:.08,gain:.24,bgain:.4}));},
    volley(){safe(()=>strike({body:560,bright:3100,dur:.06,gain:.44,bgain:.54}));},
    pop(){safe(()=>strike({body:500,bright:3300,dur:.14,gain:.62,bgain:.5,decay:.22}));},
    tap(){safe(()=>tone(430,.045,.045,'triangle'));},
    point(){safe(()=>{strike({body:500,bright:3300,dur:.14,gain:.62,bgain:.5,decay:.22});crowd(1.1,.075);tone(659,.42,.09,'triangle',.02);tone(988,.5,.06,'triangle',.12);});},
    weak(){safe(()=>{tone(196,.3,.11,'sine');tone(147,.34,.08,'sine',.08);});}
  };
})();

/* ─────────────── PLAYBOOK RENDERER (from the app: GS_REPLAY.project + buildMultiShotSVG) ─────────────── */
const GS_REPLAY={
  project(x,y,bounds){
    const b=bounds||{top:10,bottom:290,left:20,right:180};
    const t=Math.max(0,Math.min(1,(y-b.top)/(b.bottom-b.top)));
    const sy=18+t*164,half=54+t*84,mid=(b.left+b.right)/2,span=(b.right-b.left)/2;
    return [150+((x-mid)/span)*half,sy];
  }
};
function buildMultiShotSVG(play){
  const stepDur=1.25, W=300, H=200;
  const project=(x,y)=>GS_REPLAY.project(x,y,{top:10,bottom:290,left:20,right:180});
  let body='';
  (play.shots||[]).forEach((s,i)=>{
    const d0=0.3+i*stepDur;
    const a=project(s.from[0],s.from[1]), b=project(s.to[0],s.to[1]);
    const x1=a[0],y1=a[1],x2=b[0],y2=b[1];
    const cx=(x1+x2)/2+(s.bend||0), cy=(y1+y2)/2-5;
    const col=s.color||GOLD, L=360;
    body+=`<path class="ms-path" d="M${x1},${y1} Q${cx},${cy} ${x2},${y2}" stroke="${col}" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L}" opacity="0" style="animation:drawPath .62s ${d0.toFixed(2)}s ease forwards;opacity:1"/>`;
    body+=`<circle class="ms-ball" r="4.6" fill="#d8f04e" stroke="#f4ffae" stroke-width="1.2" filter="url(#msBallGlow)" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.9;1" dur=".68s" begin="${d0.toFixed(2)}s" fill="freeze"/><animateMotion dur=".62s" begin="${d0.toFixed(2)}s" fill="freeze" path="M${x1},${y1} Q${cx},${cy} ${x2},${y2}"/></circle>`;
    const isPayoff=!!s.payoff;
    const label=s.label||(i+1);
    const labelSize=String(label).length>14?4.6:String(label).length>10?5.2:6.6;
    body+=`<g class="ms-reveal${isPayoff?' pb-payoff-pulse':''}" opacity="0" style="animation:tpop .3s ${(d0+0.58).toFixed(2)}s ease both"><circle cx="${x2}" cy="${y2}" r="${isPayoff?15:12}" fill="${isPayoff?'rgba(91,186,111,.14)':'rgba(255,255,255,.06)'}" stroke="${col}" stroke-width="1.5" stroke-dasharray="4,3"/><text x="${x2}" y="${y2+2.5}" text-anchor="middle" fill="${col}" font-size="${labelSize}" font-weight="800" font-family="DM Sans,sans-serif">${label}</text></g>`;
  });
  const netY=project(100,150)[1];
  const farSL=project(100,80)[1], nearSL=project(100,220)[1];
  const farServeL=project(33,80)[0],farServeR=project(167,80)[0],nearServeL=project(33,220)[0],nearServeR=project(167,220)[0];
  const farSinglesL=project(33,10)[0],farSinglesR=project(167,10)[0],nearSinglesL=project(33,290)[0],nearSinglesR=project(167,290)[0];
  const youS=play.youStart?project(play.youStart[0],play.youStart[1]):project(100,270);
  const oppS=play.oppStart?project(play.oppStart[0],play.oppStart[1]):project(100,30);
  const youE=play.youEnd?project(play.youEnd[0],play.youEnd[1]):youS;
  const oppE=play.oppEnd?project(play.oppEnd[0],play.oppEnd[1]):oppS;
  const youTravels=Math.hypot(youE[0]-youS[0],youE[1]-youS[1])>6;
  const oppTravels=Math.hypot(oppE[0]-oppS[0],oppE[1]-oppS[1])>6;
  const sitter=play.sitter?(()=>{const p=project(play.sitter[0],play.sitter[1]);return `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#e8f4d8"><animate attributeName="r" values="4;6;4" dur="1.15s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.55;1" dur="1.15s" repeatCount="indefinite"/></circle>`;})():'';
  return `<svg viewBox="0 0 ${W} ${H}" class="ms-svg" font-family="DM Sans,sans-serif">
    <defs><linearGradient id="msCourtSurface" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#215d28"/><stop offset="1" stop-color="#143f19"/></linearGradient><filter id="msBallGlow" x="-200%" y="-200%" width="400%" height="400%"><feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="#d8f04e" flood-opacity=".85"/></filter></defs>
    <path d="M96,18 L204,18 L288,182 L12,182 Z" fill="url(#msCourtSurface)" stroke="rgba(255,255,255,.52)" stroke-width="1.6"/>
    <line x1="66" y1="${netY}" x2="234" y2="${netY}" stroke="rgba(255,255,255,.78)" stroke-width="2.4"/>
    <line x1="${farServeL}" y1="${farSL}" x2="${farServeR}" y2="${farSL}" stroke="rgba(255,255,255,.33)" stroke-width="1"/>
    <line x1="${nearServeL}" y1="${nearSL}" x2="${nearServeR}" y2="${nearSL}" stroke="rgba(255,255,255,.33)" stroke-width="1"/>
    <line x1="150" y1="${farSL}" x2="150" y2="${nearSL}" stroke="rgba(255,255,255,.27)" stroke-width="1"/>
    <line x1="${farSinglesL}" y1="18" x2="${nearSinglesL}" y2="182" stroke="rgba(255,255,255,.2)" stroke-width="1"/>
    <line x1="${farSinglesR}" y1="18" x2="${nearSinglesR}" y2="182" stroke="rgba(255,255,255,.2)" stroke-width="1"/>
    <text x="18" y="194" fill="rgba(200,168,75,.42)" font-size="7" letter-spacing="1">YOU</text>
    <circle cx="${youS[0]}" cy="${youS[1]}" r="5.2" fill="#c8a84b" stroke="rgba(255,255,255,.8)" stroke-width="1">${youTravels?`<animate attributeName="cx" from="${youS[0]}" to="${youE[0]}" begin=".9s" dur=".5s" fill="freeze"/><animate attributeName="cy" from="${youS[1]}" to="${youE[1]}" begin=".9s" dur=".5s" fill="freeze"/>`:''}</circle>
    <circle cx="${oppS[0]}" cy="${oppS[1]}" r="5.2" fill="#e07070" stroke="rgba(255,255,255,.65)" stroke-width="1">${oppTravels?`<animate attributeName="cx" from="${oppS[0]}" to="${oppE[0]}" begin=".9s" dur=".5s" fill="freeze"/><animate attributeName="cy" from="${oppS[1]}" to="${oppE[1]}" begin=".9s" dur=".5s" fill="freeze"/>`:''}</circle>
    ${sitter}${body}
  </svg>`;
}

/* ═══════════════════════════════  SCENARIOS  ═══════════════════════════════
   Coords: x∈[20,180] (100 centre), y∈[10,290]. YOU near baseline (y~270), OPP far (y~30).
   Colours: gold=your build, red=their answer, green(payoff)=your winner.
   Every finish (win/mid) carries an `intent` the validator checks against BOTH its
   coordinates and its coaching text — text and visuals can't drift out of tandem.  */
const SCENARIOS = [
  {
    id:'short_ball', title:'Short Ball',
    opp:"<b>Counter-puncher</b> — defends deep, feeds off your pace. Patience, then commit.",
    d1:{
      sit:"You've pushed the counter-puncher deep. Their tired reply sits up short at your service line — you've stepped in early.",
      q:"How do you play the short ball?",
      opts:[
        {lbl:'Drive it hard into the open court', sub:'Take time away — go for the corner', br:'A'},
        {lbl:'Approach deep and close the net',   sub:'Controlled — pressure them into a pass', br:'B'}
      ],
      court:{shots:[], sitter:[100,205]}
    },
    A:{
      seq:{youStart:[100,270], oppStart:[100,30], oppEnd:[44,44], shots:[
        {from:[100,268], to:[44,44], bend:8, color:GOLD, snd:'drive', label:'DRIVE'},
        {from:[44,44], to:[112,208], bend:-16, color:RED, snd:'slice', label:'FLOATER'} ]},
      reveal:"Good drive — but a counter-puncher's legs turn your winner into a <b>floated second chance</b>. Now the read: which way are they recovering?",
      d2:{sit:"Their floater sits up mid-court. They scrambled wide and are now <b>sprinting back toward the middle.</b>", q:"Option off the option — where do you put it?",
        opts:[
          {lbl:'Behind them — into the corner they left', sub:'Wrong-foot the recovering player', win:true},
          {lbl:"Into the open court they're running to", sub:'Hit to the space on the other side', win:false} ]},
      win:{youStart:[100,255], oppStart:[62,52], oppEnd:[104,40], shots:[
        {from:[100,255], to:[46,48], bend:8, color:GREEN, snd:'pop', payoff:true, label:'BEHIND THEM', intent:'behind'} ]},
      winTitle:'Point won.',
      winTxt:"You read the runner. They committed their weight to recovering the open court — so the ball <b>behind</b> them makes them stop, reverse and reach. Against a mover, the wrong-foot beats the open court far more often than not.",
      mid:{youStart:[100,255], oppStart:[62,52], oppEnd:[158,46], shots:[
        {from:[100,255], to:[158,46], bend:-8, color:GOLD, snd:'drive', label:'OPEN COURT', intent:'into_run'} ]},
      midTitle:'They got there.',
      midTxt:"Clean shot — but a counter-puncher was already recovering that way. You hit into their run. The open court is the instinct; <b>behind them</b> was the kill, because their momentum was the thing to exploit."
    },
    B:{
      seq:{youStart:[100,270], youEnd:[100,182], oppStart:[100,30], oppEnd:[158,46], shots:[
        {from:[100,268], to:[158,46], bend:-10, color:GOLD, snd:'drive', label:'APPROACH'},
        {from:[158,46], to:[108,178], bend:12, color:RED, snd:'drive', label:'DIPPING PASS'} ]},
      reveal:"Deep approach — so their pass has to come <b>up</b>, and it's dipping at your feet. You're at the net now. <b>Low ball, no pace to borrow.</b>",
      d2:{sit:"You're at the net. Their pass is <b>low and dipping at your feet</b> — below the net cord, no pace on it.", q:"Option off the option — how do you volley it?",
        opts:[
          {lbl:'Punch it deep and hold your position', sub:"Can't hit down — so reset deep", win:true},
          {lbl:'Go for the sharp angle winner', sub:'End it now with a touch angle', win:false} ]},
      win:{youStart:[100,182], oppStart:[158,46], oppEnd:[150,42], shots:[
        {from:[100,182], to:[158,42], bend:-8, color:GREEN, snd:'volley', payoff:true, label:'DEEP VOLLEY', intent:'deep'} ]},
      winTitle:'Point won.',
      winTxt:"From below the net you can't hit down — so you don't gamble. The <b>deep</b> volley pins them back, keeps you at net, and you take the next ball from strength. Patience finishes the point the greedy angle would have missed.",
      mid:{youStart:[100,182], oppStart:[158,46], oppEnd:[158,46], shots:[
        {from:[100,182], to:[42,116], bend:6, color:GOLD, snd:'volley', label:'ANGLE', intent:'angle'} ]},
      midTitle:'Into the net.',
      midTxt:"From a ball at your feet the sharp <b>angle</b> has almost no margin — you have to lift it and hope. Tempting, but it's the low-percentage swing. Deep and boring wins this one; the winner comes on the ball after."
    }
  },
  {
    id:"serve_plus_one", title:"Serve +1 Wide",
    opp:"<b>Returner crowds the middle</b> to guard the backhand — the wide serve is open.",
    d1:{
      sit:"30–30. You've noticed they crowd the centre. You crack a serve out wide and drag them off court — their stretched reply floats back short.",
      q:"Where's your +1?",
      opts:[
        {lbl:"Drive to the open court", sub:"Take the space the serve just made", br:"A"},
        {lbl:"Approach behind a deep +1", sub:"Come to net off the weak reply", br:"B"}
      ],
      court:{shots:[], sitter:[104,206]}
    },
    A:{
      seq:{youStart:[100,258], oppStart:[158,55], oppEnd:[55,52], shots:[
        {from:[100,255], to:[42,50], bend:8, color:GOLD, snd:"drive", label:"OPEN COURT"},

/* ─────────────────────────  RUNTIME SELF-CHECK  ───────────────────────── */
// A lightweight mirror of the release-gate validator, so a broken scenario can never
// silently reach the deck. It quarantines any scenario that fails and stamps the result.
const INTENT_GEO = {
  behind:  (s,c)=> dist(s.to,c.oppStart) < dist(s.to,c.oppEnd),   // to where they came from
  space:   (s,c)=> dist(s.to,c.oppEnd) > 32,                       // where they aren't
  deep:    (s)=> s.to[1] < 95,                                     // deep in their court
  jam:     (s,c)=> dist(s.to,c.oppEnd) < 26,                       // at their body
  into_run:(s,c)=> dist(s.to,c.oppEnd) < 34,                       // into their recovery
  angle:   (s)=> s.to[1] > 100 && Math.abs(s.to[0]-100) > 46,      // short + wide (low %)
  reset:   (s)=> s.to[1] < 120 && Math.abs(s.to[0]-100) < 46,      // deep + central
  risk:    ()=> true                                               // greedy option — checked via text
};
const INTENT_WORD = {
  behind:/behind|wrong.?foot/i, space:/open|space|behind|away/i, deep:/deep/i,
  jam:/body|jam|hip/i, into_run:/open|run|their run|space/i, angle:/angle/i,
  reset:/reset|neutral|deep|middle|rebuild|buy/i, risk:/margin|coin.?flip|low.?percentage|long|net|miss|gamble/i
};
function dist(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1]);}
function inBounds(p){return p[0]>=12&&p[0]<=188&&p[1]>=8&&p[1]<=292;}
function validateScenario(s){
  const e=[];
  const chk=(cond,msg)=>{ if(!cond) e.push(msg); };
  chk(s.id&&s.title&&s.opp,'missing id/title/opp');
  chk(s.d1&&s.d1.q&&Array.isArray(s.d1.opts)&&s.d1.opts.length===2,'d1 must have a question and two options');
  ['A','B'].forEach(bk=>{
    const b=s[bk]; if(!b){e.push('missing branch '+bk);return;}
    chk(b.d1||s.d1.opts.some(o=>o.br===bk),'no d1 option routes to '+bk);
    chk(Array.isArray(b.seq&&b.seq.shots)&&b.seq.shots.length>=2,bk+': seq needs ≥2 shots');
    chk((b.reveal||'').length>=40,bk+': reveal too thin');
    chk(b.d2&&Array.isArray(b.d2.opts)&&b.d2.opts.length===2,bk+': d2 needs two options');
    chk(b.d2&&b.d2.opts.filter(o=>o.win).length===1,bk+': d2 needs exactly one winning option');
    chk((b.winTxt||'').length>=40&&(b.midTxt||'').length>=40,bk+': coach reads too thin');
    // ball continuity: each reply starts where the last ball landed
    (b.seq.shots||[]).forEach((sh,i)=>{ if(i>0) chk(dist(sh.from,b.seq.shots[i-1].to)<26,bk+' seq shot '+i+': ball teleported'); });
    // colour semantics + bounds
    (b.seq.shots||[]).forEach((sh,i)=>{
      chk(inBounds(sh.from)&&inBounds(sh.to),bk+' seq shot '+i+': off court');
      if(i===0) chk(sh.color===GOLD,bk+' seq: your first shot must be gold');
      if(i===1) chk(sh.color===RED,bk+" seq: the opponent's reply must be red");
    });
    // finishes: exactly one green payoff on the win, none on the mid; intent tandem
    ['win','mid'].forEach(fk=>{
      const f=b[fk]; if(!f||!Array.isArray(f.shots)){e.push(bk+': missing '+fk);return;}
      const last=f.shots[f.shots.length-1];
      chk(inBounds(last.from)&&inBounds(last.to),bk+' '+fk+': shot off court');
      if(fk==='win'){ chk(last.payoff===true&&last.color===GREEN,bk+' win: finish must be a green payoff shot'); }
      else { chk(!f.shots.some(x=>x.payoff)&&!f.shots.some(x=>x.color===GREEN),bk+' mid: neutral outcome must not be a green payoff'); }
      // intent ↔ geometry ↔ text
      const intent=last.intent; chk(intent&&INTENT_GEO[intent],bk+' '+fk+': finish needs a known intent');
      if(intent&&INTENT_GEO[intent]){
        const ctx={oppStart:f.oppStart||[100,30], oppEnd:f.oppEnd||f.oppStart||[100,30]};
        chk(INTENT_GEO[intent](last,ctx),bk+' '+fk+' ('+intent+'): coordinates contradict the intent');
        const txt=(fk==='win'?b.winTxt:b.midTxt)+' '+(b.d2.opts.find(o=>o.win===(fk==='win'))?.lbl||'');
        chk(INTENT_WORD[intent].test(txt),bk+' '+fk+' ('+intent+'): coaching text does not match the intent');
      }
    });
  });
  return e;
}
function validateAll(){
  const valid=[], report=[];
  SCENARIOS.forEach(s=>{ const e=validateScenario(s); if(e.length){ report.push({id:s.id,errors:e}); console.error('[LIVE POINT] quarantined:',s.id,e); } else valid.push(s); });
  document.documentElement.dataset.lpValid=String(valid.length);
  document.documentElement.dataset.lpTotal=String(SCENARIOS.length);
  document.documentElement.dataset.lpErrors=report.map(r=>r.id+':'+r.errors.length).join('|');
  return valid;
}
const LIVE = validateAll();  // only validated scenarios ever reach the deck

const court=document.getElementById('court');
const stage=document.getElementById('stage');
const deck=document.getElementById('deck');
const badge=document.getElementById('badge');
let cur=0, branch=null;
const READ_PAUSE=520;

function paint(play){ court.innerHTML=buildMultiShotSVG(play); }
function seqLen(play){ return 0.3 + (play.shots||[]).length*1.25; }
function playSeq(play, done){
  paint(play);
  (play.shots||[]).forEach((s,i)=>{ setTimeout(()=>{ (SND[s.snd]||SND.drive)(); }, (0.3+i*1.25)*1000); });
  if(done) setTimeout(done, seqLen(play)*1000 + 220);
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function dots(active){const d=document.getElementById('dots');d.innerHTML='';for(let i=0;i<3;i++){const s=document.createElement('div');s.className='sd'+(i<active?' done':i===active?' on':'');d.appendChild(s);}}
function flashParticles(){const w=document.querySelector('.court-wrap');for(let i=0;i<16;i++){const d=document.createElement('div');const s=4+Math.random()*4;d.style.cssText=`position:absolute;left:50%;top:46%;width:${s}px;height:${s}px;border-radius:50%;background:${Math.random()<.5?GREEN:GOLD};pointer-events:none;z-index:4;`;w.appendChild(d);const ang=Math.random()*6.28,dist=44+Math.random()*80;const dx=Math.cos(ang)*dist,dy=Math.sin(ang)*dist-20;d.animate([{transform:'translate(-50%,-50%)',opacity:1},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`,opacity:0}],{duration:750+Math.random()*350,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>d.remove();}}

function optHTML(list){
  return '<div class="opts">'+list.map((o,i)=>
    `<button class="opt" data-i="${i}"><div class="opt-ltr">${'AB'[i]}</div><div class="opt-body"><div class="opt-lbl">${o.lbl}</div><div class="opt-sub">${o.sub}</div></div></button>`
  ).join('')+'</div>';
}
function bindOpts(fn){[...stage.querySelectorAll('.opt')].forEach(b=>b.onclick=()=>{SND.tap();fn(+b.dataset.i,[...stage.querySelectorAll('.opt')]);});}
function lock(b){b.forEach(x=>x.classList.add('locked'));}
const S=()=>LIVE[cur];

function buildDeck(){
  deck.innerHTML=LIVE.map((s,i)=>`<button class="chip${i===cur?' on':''}" data-i="${i}">${s.title}</button>`).join('');
  [...deck.querySelectorAll('.chip')].forEach(c=>c.onclick=()=>{SND.tap();cur=+c.dataset.i;intro();});
}

function intro(){
  buildDeck();
  branch=null; dots(0);
  badge.innerHTML=`<span class="k">Opponent</span>${S().opp}`;
  paint(S().d1.court||{shots:[]});
  stage.innerHTML=`
    <div class="sit">${S().d1.sit}</div>
    <div class="q">${S().d1.q}</div>
    ${optHTML(S().d1.opts)}`;
  bindOpts(choose1);
}

async function choose1(i,btns){
  lock(btns);
  const o=S().d1.opts[i]; branch=o.br; const B=S()[branch];
  btns[i].classList.add('chosen','good');
  await new Promise(res=>playSeq(B.seq, res));
  await wait(READ_PAUSE);
  const r=document.createElement('div'); r.className='reveal info';
  r.innerHTML=`<div class="reveal-tag">The point isn't over</div><div class="reveal-txt">${B.reveal}</div>`;
  stage.appendChild(r); requestAnimationFrame(()=>r.classList.add('show'));
  const btn=document.createElement('button'); btn.className='btn'; btn.textContent='Read their reply →';
  stage.appendChild(btn); btn.onclick=()=>{SND.tap();decision2();};
  r.scrollIntoView({behavior:'smooth',block:'center'});
}

function decision2(){
  const B=S()[branch]; dots(1);
  stage.innerHTML=`
    <div class="sit">${B.d2.sit}</div>
    <div class="q">${B.d2.q}</div>
    ${optHTML(B.d2.opts)}`;
  bindOpts(choose2);
}

async function choose2(i,btns){
  lock(btns);
  const B=S()[branch]; const o=B.d2.opts[i]; const isWin=o.win;
  btns[i].classList.add('chosen', isWin?'good':'mid');
  const other=B.d2.opts.findIndex(x=>x.win); if(other>=0 && other!==i) btns[other].classList.add('correct-ghost');
  await new Promise(res=>playSeq(isWin?B.win:B.mid, res));
  if(isWin){ flashParticles(); SND.point(); } else { SND.weak(); }
  await wait(120);
  result(isWin, isWin?B.winTitle:B.midTitle, isWin?B.winTxt:B.midTxt);
}

function result(isWin,title,txt){
  dots(3);
  const hasNext=cur<LIVE.length-1;
  stage.innerHTML=`
    <div class="reveal ${isWin?'good':'mid'} show" style="margin-top:16px;">
      <div class="result-title ${isWin?'win':'neutral'}">${title}</div>
      <div class="reveal-txt">${txt}</div>
    </div>
    ${hasNext?`<button class="btn" id="next">Next Live Point →</button>`:''}
    <button class="btn ghost" id="again">Play the other line →</button>`;
  if(hasNext) document.getElementById('next').onclick=()=>{SND.tap();cur++;intro();};
  document.getElementById('again').onclick=()=>{SND.tap();intro();};
  document.querySelector('.result-title').scrollIntoView({behavior:'smooth',block:'center'});
}

intro();
</script>
